# OrderSafe-K8s engine gate: complete, audit-friendly workflow.
# Isolated GitHub runner only. Does not touch any existing user cluster.
name: OrderSafe Kyverno Real Engine Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordersafe-real-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Create evidence folder
        shell: bash
        run: mkdir -p evidence
      - name: Create isolated Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          kubectl_version: v1.35.5
          node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          cluster_name: ordersafe-engine
          wait: 180s
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: Test isolated, paired, and workaround policy cases
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p evidence
          phase=starting
          status=BLOCKED_OR_FAILED
          reason=NOT_COMPLETED
          runtime_verified=false
          finish() {
            local rc=$?
            if [ "$status" = BLOCKED_OR_FAILED ]; then reason="ERROR_IN_${phase}"; fi
            jq -n --arg status "$status" --arg reason "$reason" --arg phase "$phase" \
              --argjson exit_code "$rc" --argjson runtime_verified "$runtime_verified" \
              '{status:$status, reason:$reason, phase:$phase, exit_code:$exit_code, runtime_verified:$runtime_verified}' \
              > evidence/summary.json
            echo "ORDER_SAFE_STATUS=$status; REASON=$reason; PHASE=$phase; EXIT=$rc"
          }
          trap finish EXIT

          # Real, isolated Kubernetes and Kyverno runtime; no existing user cluster is touched.
          phase=cluster_preflight
          kubectl version -o json > evidence/kubernetes-version.json
          kubectl get nodes -o wide > evidence/nodes.txt
          helm version --short > evidence/helm-version.txt

          phase=install_kyverno
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update kyverno
          helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace \
            --version 3.8.1 --wait --timeout 12m
          helm list -n kyverno -o json > evidence/helm-releases.json
          kubectl get pods -n kyverno -o wide > evidence/kyverno-pods.txt
          kubectl wait --for=condition=Established --timeout=120s crd/mutatingpolicies.policies.kyverno.io

          phase=create_test_namespace
          NS=ordersafe-gate
          kubectl create namespace "$NS"

          # Policy B: mutate UPDATE on specifically labeled ConfigMaps.
          cat > /tmp/ordersafe-policy-b.yaml <<'POLICY_B'
          apiVersion: policies.kyverno.io/v1
          kind: MutatingPolicy
          metadata:
            name: ordersafe-b-watch-configmaps
          spec:
            failurePolicy: Fail
            matchConstraints:
              resourceRules:
                - apiGroups: ['']
                  apiVersions: ['v1']
                  operations: ['UPDATE']
                  resources: ['configmaps']
              objectSelector:
                matchLabels:
                  ordersafe.io/watch: 'true'
            mutations:
              - patchType: ApplyConfiguration
                applyConfiguration:
                  expression: >
                    Object{
                      metadata: Object.metadata{
                        annotations: {"ordersafe.io/mut-b": "yes"}
                      }
                    }
          POLICY_B

          # Policy A: distinct resource rules and objectSelector, as in the reported issue.
