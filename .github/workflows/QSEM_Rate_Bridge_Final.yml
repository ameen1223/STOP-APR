      - name: Final evidence summary
        if: always()
        shell: bash
        env:
          QSEM_STEP_RESTORE: ${{ steps.restore.outcome }}
          QSEM_STEP_LOCAL: ${{ steps.local.outcome }}
          QSEM_STEP_PROMDOWNLOAD: ${{ steps.promdownload.outcome }}
          QSEM_STEP_PROMQL: ${{ steps.promql.outcome }}
        run: |
          python - <<'PY_FINAL_SUMMARY'
          import os,json
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          stages={k.removeprefix('QSEM_STEP_').lower():v for k,v in os.environ.items() if k.startswith('QSEM_STEP_')}
          required=['source_hashes.json','rate_bridge_local_audit.json','rate_bridge_go_replay.json',
                    'promql_rate_bridge.yml','promql_rate_bridge_manifest.json',
                    'promtool_version.txt','promtool_rate_bridge.log','prometheus_sha256_check.log']
          missing=[x for x in required if not (out/x).exists() or (out/x).stat().st_size==0]
          engine_ok = (out/'promtool_rate_bridge.log').exists() and 'SUCCESS' in (out/'promtool_rate_bridge.log').read_text()
          prior=(out/'rate_bridge_local_audit.json').exists()
          source_ok=(out/'source_hashes.json').exists()
          local_status=json.loads((out/'rate_bridge_local_audit.json').read_text()) if prior else {}
          status='PASS' if all(v=='success' for v in stages.values()) and len(stages)==4 and not missing and engine_ok and local_status.get('status')=='PASS' and source_ok else 'INCOMPLETE'
          res={'status':status,'stage_outcomes':stages,'missing_artifacts':missing,
               'actual_prometheus_3_15_1_engine_success':bool(engine_ok),
               'promql_expression_checks':3 if engine_ok else None,
               'ideal_arithmetic_random_paired_checks':local_status.get('random_paired_ideal_decisions'),
               'go_source_formula_random_checks':10000 if (out/'rate_bridge_go_replay.json').exists() else None,
               'theorem_scope':'restricted, exact-rational, paired-zero-origin, aligned two-scrape classic float-counter rate() with no resets or other transforms',
               'frozen_gate01_06_reexecuted':False,
               'prometheus_float64_general_soundness_proven':False,
               'journal_originality_at_least_8_5_proven':False,
               'research_decision':'Conditional rate-to-static reduction verified in scoped fixtures only; preserve old results'}
          (out/'summary.json').write_text(json.dumps(res,indent=2))
