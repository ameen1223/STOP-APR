            https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz \
            2>&1 | tee out/prometheus_download.log
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  prometheus.tar.gz" | sha256sum -c - | tee out/prometheus_sha256_check.log
          tar -xzf prometheus.tar.gz prometheus-3.15.1.linux-amd64/promtool
