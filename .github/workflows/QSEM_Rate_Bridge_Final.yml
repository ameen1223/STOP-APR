          open('out/source_hashes.json','w').write(json.dumps(expected,indent=2))
          print('FROZEN_AND_NEW_SOURCE_HASHES_PASS')
          PY_SOURCE_VERIFY
          sha256sum rounding_certificate.py active_bucket_certificate.py rate_bridge_guard.py rate_bridge_audit.py rate_bridge_independent.go generate_promql_fixture.py > out/source_sha256.txt
      - name: Independent offline proof and counterexamples
