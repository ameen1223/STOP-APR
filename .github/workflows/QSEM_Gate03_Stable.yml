name: QSEM Gate03 Stable Prometheus Replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip install --disable-pip-version-check --no-cache-dir "scipy==1.17.0" "PyYAML==6.0.3" "opentelemetry-sdk==1.42.1" "opentelemetry-instrumentation-urllib==0.63b1" 2>&1 | tee out/pip_install.log
          python -m pip check 2>&1 | tee out/pip_check.log
          python -m pip freeze | grep -E "^(scipy|opentelemetry|PyYAML)" | tee python_versions.txt
          cp python_versions.txt out/python_versions.txt
          python - <<'PY_QSEM_DEP_VERIFY'
          from importlib.metadata import version
          assert version('opentelemetry-sdk')=='1.42.1'
          assert version('opentelemetry-instrumentation-urllib')=='0.63b1'
          assert version('opentelemetry-semantic-conventions')=='0.63b1'
          print('PIN_COMPATIBILITY_PASS')
          PY_QSEM_DEP_VERIFY
      - name: Restore versioned self-contained source
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > rounding_certificate.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Q-SEM exact restricted certificates for legacy integer-ms HTTP duration histograms.
          
          Scope:
            - Legacy old observations: Python round(t_seconds*1000), clamped at 0.
            - All t >= 0, no NaNs; bucket boundaries in integral milliseconds.
            - Old histogram count, cumulative counts, and integer rounded _sum known.
            - New histogram records full precision seconds and uses positive old boundaries
              converted from milliseconds, omitting the old zero boundary.
            - Prometheus *classic histogram* quantile, no native histograms, no resets,
              label changes, server-side reaggregation, scrape gaps or rate extrapolation.
          
          For a threshold between target bucket edges b_i and b_{i+1}, only the number of
          legacy observations exactly rounded to these two edges that cross to the next
          bucket changes the linearly interpolated CDF at that threshold. A global
          integer-sum budget constrains their maximal number. Thus a two-variable
          bounded knapsack, solved exactly by residue arithmetic, suffices for a sound
          fixed-threshold alert certificate without reconstructing all observations.
          
          This is a research prototype, NOT a complete PromQL translation/certifier.
          """
          from __future__ import annotations
          from dataclasses import dataclass
          from fractions import Fraction
          from math import gcd
          from typing import Optional
          import json
          
          
          def fq(v):
              if isinstance(v, Fraction):return v
              return Fraction(str(v))
          
          
          def _pair_opt(costs, caps, weights, budget):
              """Max w_i*z_i for <=2 bounded integer items; period-class exact search.
          
              Costs/weights/caps are nonnegative. Residue classes cut a constant-slope
              objective between saturation points of the other item, so endpoint checks
              suffice. Complexity O(min(c1,c2)/gcd(c1,c2)) in 2-item case independent of
              the number of observations.
              """
              if not costs:return Fraction(0), []
              assert all(isinstance(c,int) and c>=0 for c in costs)
              assert all(isinstance(n,int) and n>=0 for n in caps)
              assert budget>=0 and len(costs)==len(weights)==len(caps) and len(costs)<=2
              if len(costs)==1:
                  c=costs[0];n=caps[0]
                  x=n if c==0 else min(n,budget//c)
                  return weights[0]*x,[x]
              a,b=costs;A,B=caps;wa,wb=weights
              if a==0 or b==0:
                  if a==0:
                      z0=A;z1=B if b==0 else min(B,budget//b)
                  else:
                      z1=B;z0=min(A,budget//a)
                  return wa*z0+wb*z1,[z0,z1]
              swap = a<b  # enumerate larger-cost item, with smaller-cost residue period
              if swap: a,b=b,a;A,B=B,A;wa,wb=wb,wa
              xmax=min(A,budget//a)
              P=b//gcd(a,b)
              border=(budget-b*B)//a # x at or below this implies y saturated
              best_val=Fraction(-1);best=None
              for r in range(min(xmax+1,P)):
                  kmax=(xmax-r)//P
                  def last_le(bound):
                      k=min(kmax,(bound-r)//P)
                      if k>=0:return r+k*P
                      return None
                  opts=[r,r+kmax*P]
                  cap=last_le(border)
                  if cap is not None:
                      opts.append(cap)
                      if cap+P<=xmax: opts.append(cap+P)
                  else:
                      opts.append(r)
                  for x in set(opts):
                      if x<0 or x>xmax:continue
                      y=min(B,(budget-a*x)//b)
                      val=wa*x+wb*y
                      if val>best_val or (val==best_val and (best is None or (x,y)<best)):
                          best_val=val;best=(x,y)
              assert best is not None
              xs=list(best[::-1] if swap else best)
              return best_val,xs
          
          
          @dataclass(frozen=True)
          class OldHistogram:
              bounds_ms:tuple[int,...]  # includes zero; excludes +Inf
              cumulative:tuple[int,...]
              count:int
              sum_rounded_ms:int
          
              def validate(self):
                  b=self.bounds_ms;c=self.cumulative
                  if not (len(b)>=3 and len(b)==len(c) and b[0]==0 and
                      all(x>=0 for x in b) and all(x<y for x,y in zip(b,b[1:])) and
                      all(isinstance(x,int) for x in b+c+(self.count,self.sum_rounded_ms)) and
                      all(0<=x<=y for x,y in zip((0,)+c,c+(self.count,))) and
                      self.sum_rounded_ms>=0):
                      raise ValueError('INVALID_HISTOGRAM')
                  ns=[c[0]]+[c[i]-c[i-1] for i in range(1,len(c))]+[self.count-c[-1]]
                  lo=[0]+[b[i-1]+1 for i in range(1,len(b))]+[b[-1]+1]
                  base=sum(n*k for n,k in zip(ns,lo))
                  maxsum=sum(n*upper for n,upper in zip(ns[:-1],b))
                  if self.sum_rounded_ms < base or (not ns[-1] and self.sum_rounded_ms>maxsum):
                      raise ValueError('OLD_SUM_INCONSISTENT_WITH_BUCKETS')
                  return ns,lo,base
          
          
          def _new_q(phi, bound_ms, new_cumulative, count):
              """Analytical classic Prom histogram quantile (supported nonnegative subset)."""
              r=fq(phi)*count
              prev_count=0;prev_bound=0
              for b,c in zip(bound_ms,new_cumulative):
                  if r<=c:
                      if c<=prev_count:return fq(b)
                      return fq(prev_bound)+fq(b-prev_bound)*(r-prev_count)/(c-prev_count)
                  prev_count=c;prev_bound=b
              return Fraction(bound_ms[-1]) # +Inf bucket -> second-highest finite edge
          
          
          def certify(old:OldHistogram,phi,threshold_ms):
              ns,lo,minsum=old.validate()
              p=fq(phi);T=fq(threshold_ms)
              if not (0<p<1):raise ValueError('PHI_OUTSIDE_RESTRICTED_RANGE')
              if old.count==0:return {'status':'UNSUPPORTED','reason':'EMPTY_HISTOGRAM'}
              b=old.bounds_ms[1:];cum=old.cumulative[1:]
              if T<0:return {'status':'CERTIFIED_FIRE','reason':'NONNEGATIVE_DURATION'}
              if T>=b[-1]:return {'status':'CERTIFIED_CLEAR','reason':'PROMETHEUS_FINITE_TOP_BUCKET'}
              right=next(i for i,x in enumerate(b) if T<=x)
              if right==0:
                  left_bound=0;left_cum=0
                  active=[right+1] # old index 1 is first positive bound
                  weights=[T/b[0]] # wrong: weight at first bound is alpha=T/b; use fraction below
                  weights=[T/fq(b[0])]
                  nominal=weights[0]*cum[0]
              else:
                  low=b[right-1];high=b[right]
                  alpha=(T-low)/fq(high-low)
                  nominal=(1-alpha)*cum[right-1]+alpha*cum[right]
                  active=[right,right+1] # indexes in legacy histogram
                  weights=[1-alpha,alpha]
              # Counts exactly on right legacy edge can move into next target bin;
              # their minimum cost relative to leftmost rounded ms in that old bin.
              costs=[old.bounds_ms[i]-lo[i] for i in active]
              caps=[ns[i] for i in active]
              budget=old.sum_rounded_ms-minsum
              maxloss,chosen=_pair_opt(costs,caps,weights,budget)
              worst=nominal-maxloss
              rank=p*old.count
              if nominal<rank: status='CERTIFIED_FIRE'
              elif worst>=rank: status='CERTIFIED_CLEAR'
              else: status='UNDECIDABLE'
              return {'status':status,'threshold_ms':str(T),'phi':str(p),
                      'count':old.count,'rank':str(rank),'nominal_interpolated_cdf':str(nominal),
                      'minimal_interpolated_cdf':str(worst),'max_weighted_loss':str(maxloss),
                      'sum_budget_over_bucket_minima':budget,
                      'active_old_bounds_ms':[old.bounds_ms[i] for i in active],
                      'max_loss_moved_counts':chosen,
                      'model':'NONNEGATIVE_PYTHON_INTEGER_MS_ROUND_TO_FULL_PRECISION_SECONDS;CLASSIC_HISTOGRAM;STATIC_EXACT_COUNTS',
                      'proof':'quantile_gt_threshold iff linearly-interpolated-CDF_at_threshold < phi*N; old bucket boundary k may migrate only when unrounded t>k; rounded integer sum limits boundary mass'}
          
          
          def old_from_ms(values, bounds=(0,5,10,25,50,75,100,250,500,750,1000,2500,5000,7500,10000)):
              vals=[round(v) for v in values]
              assert all(v>=0 and isinstance(v,int) for v in vals)
              return OldHistogram(tuple(bounds),tuple(sum(k<=e for k in vals) for e in bounds),len(vals),sum(vals))
          
          
          def target_from_events_ms(events,bounds):
              positives=bounds[1:]
              return [sum(v<=e for v in events) for e in positives]
          
          
          def run_samples():
              b=(0,5,10,25,50,75,100,250,500,750,1000,2500,5000,7500,10000)
              examples=[]
              for name,events,threshold in [
                  ('identical_4p6',[4.6]*100,7),
                  ('identical_5p4',[5.4]*100,7),
                  ('identical_1p2',[1.2]*100,7),
                  ('identical_4p0',[4.0]*100,7),
                  ('identical_0p0',[0.0]*100,7),
                  ('mixed_low',[1.2]*96+[4.9]*4,7),
              ]:
                  old=old_from_ms(events,b)
                  cert=certify(old,Fraction(95,100),threshold)
                  newer=target_from_events_ms(events,b)
                  quantile=_new_q(Fraction(95,100),b[1:],newer,len(events))
                  actual=quantile>threshold
                  predicts={'CERTIFIED_FIRE':True,'CERTIFIED_CLEAR':False}.get(cert['status'])
                  if predicts is not None: assert predicts==actual,(name,cert,float(quantile))
                  examples.append({'case':name,'new_p95_ms':str(quantile),'alert':actual,
                                   'certificate':cert['status'],'max_loss_moved_counts':cert.get('max_loss_moved_counts')})
              return examples
          
          if __name__=='__main__':
              print(json.dumps(run_samples(),indent=2))
          PY_QSEM_SCRIPT
          cat > test_certificate.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Independent brute-force checks of Q-SEM static bounded alert certificates."""
          import importlib.util
          import itertools
          import math
          import random
          from fractions import Fraction
          from collections import Counter
          import json
          import time
          from pathlib import Path
          from scipy.optimize import milp, Bounds, LinearConstraint
          
          from rounding_certificate import (_pair_opt, OldHistogram, certify, old_from_ms,
                                            target_from_events_ms,_new_q, fq)
          
          rng=random.Random(29076)
          checks=0
          for i in range(15000):
              costs=[rng.randrange(0,50) for _ in range(2)]
              caps=[rng.randrange(0,16) for _ in range(2)]
              budget=rng.randrange(0,250)
              weights=[Fraction(rng.randrange(0,15),rng.randrange(1,11)) for _ in range(2)]
              got,z=_pair_opt(costs,caps,weights,budget)
              truth=max((weights[0]*x+weights[1]*y,(x,y)) for x in range(caps[0]+1) for y in range(caps[1]+1)
                        if costs[0]*x+costs[1]*y<=budget)[0]
              assert got==truth,(costs,caps,budget,weights,got,truth)
              assert costs[0]*z[0]+costs[1]*z[1]<=budget
              checks+=1
          
          # Exhaustive oracle independently enumerates all possible rounded integer values,
          # all integer-sum-consistent old-worlds, and before/after boundary outcomes.
          bounds=(0,2,4,7)
          truth_cases=0
          for i in range(250):
              n=rng.randrange(2,6)
              vals=[rng.randrange(0,9) for _ in range(n)]
              h=old_from_ms(vals,bounds)
              # A source with positive high unbounded bucket is costly to enumerate;
              # restrict the complete-world oracle to k<=8 and explicitly ignore any
              # case with nonzero tail, then compare only whose max possible k<=7.
              if h.count!=h.cumulative[-1]: continue
              ph=rng.choice([Fraction(1,2),Fraction(3,4),Fraction(9,10),Fraction(19,20)])
              T=rng.choice([Fraction(x,2) for x in range(0,15)])
              answer=certify(h,ph,T)
              targets=set()
              for ks in itertools.combinations_with_replacement(range(8),n):
                  if sum(ks)!=h.sum_rounded_ms:continue
                  if tuple(sum(k<=e for k in ks) for e in bounds)!=h.cumulative:continue
                  # For each element k which is exact positive edge, both sides possible.
                  alternatives=[(k-.2,k+.2) if k in bounds[1:] else (float(k),) for k in ks]
                  for ts in itertools.product(*alternatives):
                      cu=target_from_events_ms(ts,bounds)
                      q=_new_q(ph,bounds[1:],cu,n)
                      targets.add(q>T)
              assert targets,(vals,h)
              predicted={"CERTIFIED_FIRE":{True},"CERTIFIED_CLEAR":{False},"UNDECIDABLE":{True,False}}[answer['status']]
              assert predicted==targets, (vals,h,ph,T,answer,targets)
              truth_cases+=1
          
          # Compare solution of weighted budget subproblem with independent scipy MILP.
          milp_checks=0
          for _ in range(300):
              costs=[rng.randrange(1,100) for _ in range(2)]
              caps=[rng.randrange(0,100) for _ in range(2)]
              budget=rng.randrange(0,3000)
              weights=[Fraction(rng.randrange(0,40),13),Fraction(rng.randrange(0,40),13)]
              exact,z=_pair_opt(costs,caps,weights,budget)
              sol=milp(c=[-float(weights[0]),-float(weights[1])],integrality=[1,1],
                       bounds=Bounds([0,0],caps),constraints=[LinearConstraint(costs,-math.inf,budget)],
                       options={'mip_rel_gap':0})
              assert sol.success
              assert abs(float(exact)+sol.fun)<1e-6,(costs,caps,budget,weights,exact,sol)
              milp_checks+=1
          
          # Verify random coupled old/new event scenarios (no false statements).
          random_checks=0
          for _ in range(10000):
              bounds=(0,5,10,25,50,75,100,250,500,750,1000,2500,5000,7500,10000)
              values=[rng.choice([rng.random()*12, rng.random()*100, rng.random()*16000,
                                  4.6,5.4, 9.8,24.9,25.1,10.4,0.0]) for k in range(rng.randrange(1,45))]
              h=old_from_ms([max(round(v),0) for v in values],bounds)
              # The rounded values above are exact old SDK values, target values are real.
              T=rng.choice([0.0,1.5,2.0,4.8,5,7,7.5,10,12,25,50,70,100,200,500,1000,2000,12000])
              phi=rng.choice([0.5,0.9,0.95,0.99])
              ans=certify(h,phi,T)
              q=_new_q(phi,bounds[1:],target_from_events_ms(values,bounds),len(values))
              outcome=(q>fq(T))
              if ans['status']=='CERTIFIED_FIRE':assert outcome,(ans,float(q))
              if ans['status']=='CERTIFIED_CLEAR':assert not outcome,(ans,float(q))
              random_checks+=1
          
          out={'pair_solver_brute_cases':checks,'world_exhaustive_cases':truth_cases,
               'milp_comparisons':milp_checks,'matched_event_random_cases':random_checks,
               'status':'PASS'}
          Path(__file__).with_name('static_tests.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY_QSEM_SCRIPT
          cat > benchmark_certificate.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Comparative, seeded synthetic event distributions; not real production paired telemetry."""
          from fractions import Fraction
          from collections import Counter,defaultdict
          from time import perf_counter
          import json,random,math
          from pathlib import Path
          from rounding_certificate import OldHistogram,certify,_new_q,target_from_events_ms,old_from_ms,fq
          
          rng=random.Random(103602)
          BOUNDS=(0,5,10,25,50,75,100,250,500,750,1000,2500,5000,7500,10000)
          phis=[0.5,0.9,0.95,0.99]
          thresholds=[2,3,4,4.5,5,5.5,6,7,7.5,8,9,10,12,15,20,25,30,50,60,100,150]
          regimes={
           'low_latency':lambda n:[rng.uniform(.0,2.5) for _ in range(n)],
           'around_5ms':lambda n:[max(0,rng.gauss(5.0,.35)) for _ in range(n)],
           'near_10ms':lambda n:[max(0,rng.gauss(9.8,.55)) for _ in range(n)],
           'mix_below_5':lambda n:[rng.uniform(0,2.2) if rng.random()<.95 else rng.uniform(4.9,5.5) for _ in range(n)],
           'broad':lambda n:[min(25000,rng.expovariate(1/12)) for _ in range(n)],
          }
          stats=defaultdict(Counter)
          confusions=[]
          bench_n=0
          t0=perf_counter()
          for regime,gen in regimes.items():
            for i in range(50):
              events=gen(200)
              old=old_from_ms([max(0,round(t)) for t in events],BOUNDS)
              new_cum=target_from_events_ms(events,BOUNDS)
              for phi in phis:
                q=_new_q(phi,BOUNDS[1:],new_cum,len(events))
                for T in thresholds:
                  cert=certify(old,phi,T)['status']
                  count=old.cumulative
                  # Bucket-only conservative interval: every event in the active old
                  # bucket could have been rounded to the upper boundary and moved.
                  c_new=OldHistogram(old.bounds_ms,old.cumulative,old.count,old.sum_rounded_ms)
                  s=c_new.validate()[0]
                  # build old minimal-rounded sum by overwriting actual _sum with a
                  # sufficiently generous moment that permits moving every old event.
                  # Max possible legacy old sum may be unbounded if +Inf tail is nonempty;
                  # a finite old sum with enough residual budget yields max bucket loss.
                  targetmax=sum(v*b for v,b in zip(s[:-1],BOUNDS))+s[-1]*(BOUNDS[-1]+1)
                  expanded=OldHistogram(BOUNDS,old.cumulative,old.count,targetmax)
                  bucket=certify(expanded,phi,T)['status']
                  flag=bool(q>fq(T))
                  pred={'CERTIFIED_FIRE':True,'CERTIFIED_CLEAR':False}
                  for title,status in (('exact_sum',cert),('bucket_only',bucket)):
                    decisive=status in pred
                    stats[regime][title+'_decisive']+=int(decisive)
                    stats[regime][title+'_unknown']+=int(not decisive)
                    stats[regime][title+'_false']+=int(decisive and pred[status]!=flag)
                  if cert in pred and bucket not in pred:
                    stats[regime]['additional']+=1
                    if len(confusions)<25: confusions.append({'regime':regime,'phi':phi,'threshold_ms':T,
                        'old_sum_ms':old.sum_rounded_ms,'new_q_ms':float(q),'cert':cert,'bucket_only':bucket})
                  if bucket in pred and cert not in pred:raise AssertionError('nonmonotonic information')
                  bench_n+=1
          runtime=perf_counter()-t0
          report={'seed':103602,'data_kind':'synthetic grouped old/new source events, not field telemetry',
                  'groups_per_regime':50,'n_per_group':200,'phis':phis,'thresholds_ms':thresholds,
                  'total_certificates':bench_n,'runtime_s':runtime,
                  'by_regime':{k:dict(v) for k,v in stats.items()},
                  'total':{k:sum(v[k] for v in stats.values()) for k in next(iter(stats.values()))},
                  'examples':confusions,
                  'status':'PASS' if sum(v['exact_sum_false']+v['bucket_only_false'] for v in stats.values())==0 else 'FAIL',
                  'limitations':['Both certificate methods use same analytic model; only optimizer checked with independent MILP and exhaustive world oracle',
                                 'Synthetic regimes not deployment prevalence estimates','PromQL rate/reset is outside model','Cannot assert >=8.5 novelty']}
          Path(__file__).with_name('comparative_synthetic.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'total':report['total'],'runtime_s':round(runtime,3),'by_regime':report['by_regime'],'status':report['status']},indent=2))
          PY_QSEM_SCRIPT
          cat > urllib_dual_real.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Exercise actual OpenTelemetry urllib instrumentation in http/dup mode.
          
          Not a deterministic 4.6/5.4 ms experiment: real networking latency is variable.
          Only a same-process paired-emission consistency and static alert-certificate test.
          """
          import os
          os.environ['OTEL_SEMCONV_STABILITY_OPT_IN']='http/dup'
          import json
          import math
          import threading
          import time
          import urllib.request
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path
          from importlib.metadata import version
          
          from opentelemetry import metrics,trace
          from opentelemetry.sdk.metrics import MeterProvider
          from opentelemetry.sdk.metrics.export import InMemoryMetricReader
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.instrumentation.urllib import URLLibInstrumentor
          from rounding_certificate import OldHistogram,certify
          
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path=='/slow':time.sleep(.012)
                  if self.path=='/medium':time.sleep(.005)
                  self.send_response(200)
                  self.send_header('Content-Type','text/plain')
                  self.send_header('Content-Length','2')
                  self.end_headers()
                  self.wfile.write(b'OK')
              def log_message(self,*args):pass
          
          
          def metric_aggregate(points):
              pts=list(points)
              if not pts:raise ValueError('NO_METRIC_DATA_POINTS')
              bound=tuple(pts[0].explicit_bounds)
              if any(tuple(p.explicit_bounds)!=bound for p in pts):
                  raise ValueError('MIXED_BUCKET_LAYOUT_IN_SAME_METRIC')
              count=sum(p.count for p in pts)
              total=sum(p.sum for p in pts)
              bc=[sum(p.bucket_counts[i] for p in pts) for i in range(len(pts[0].bucket_counts))]
              assert sum(bc)==count
              return {'boundaries':bound,'count':count,'sum':total,'counts':bc,
                      'number_of_attribute_groups':len(pts)}
          
          def run(output):
              r=InMemoryMetricReader()
              provider=MeterProvider(metric_readers=[r])
              metrics.set_meter_provider(provider)
              trace.set_tracer_provider(TracerProvider())
              server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
              th=threading.Thread(target=server.serve_forever,daemon=True)
              th.start()
              instr=URLLibInstrumentor()
              instr.instrument()
              try:
                  count=0
                  for name,n in [('fast',25),('medium',25),('slow',25)]:
                      for _ in range(n):
                          url=f'http://127.0.0.1:{server.server_address[1]}/{name}'
                          with urllib.request.urlopen(url,timeout=5) as response:
                              assert response.status==200 and response.read()==b'OK'
                          count+=1
                  d=r.get_metrics_data()
                  metrics_by_name={}
                  for rm in d.resource_metrics:
                      for sm in rm.scope_metrics:
                          for m in sm.metrics:
                              metrics_by_name.setdefault(m.name,[]).extend(m.data.data_points)
                  old_name='http.client.duration';new_name='http.client.request.duration'
                  if old_name not in metrics_by_name or new_name not in metrics_by_name:
                      raise ValueError('HTTP_DUP_METRICS_MISSING '+repr(sorted(metrics_by_name)))
                  old=metric_aggregate(metrics_by_name[old_name]);new=metric_aggregate(metrics_by_name[new_name])
                  if old['count']!=count or new['count']!=count:
                      raise ValueError('DUAL_EMISSION_COUNT_MISMATCH')
                  if any(abs(x-y)>1e-9 for x,y in zip(old['boundaries'][1:],
                                                 (x*1000 for x in new['boundaries']))):
                      raise ValueError('INCOMPATIBLE_REAL_BUCKET_BOUNDARIES')
                  if old['boundaries'][0]!=0:
                      raise ValueError('OLD_ZERO_BOUNDARY_MISSING')
                  assert math.isclose(old['sum'],round(old['sum']),abs_tol=1e-6)
                  cumulative=[];s=0
                  for n in old['counts'][:-1]:s+=n;cumulative.append(s)
                  h=OldHistogram(tuple(int(b) for b in old['boundaries']),tuple(cumulative),count,int(round(old['sum'])))
                  certs=[]
                  for phi in [0.5,0.9,0.95,0.99]:
                      for threshold_ms in [3,5,7,10,15,25,50]:
                          c=certify(h,phi,threshold_ms)
                          # Validate against actual captured target buckets. Prom classic
                          # percentile computed separately inside a conservative subset.
                          new_c=[];s2=0
                          for n in new['counts'][:-1]:s2+=n;new_c.append(s2)
                          from rounding_certificate import _new_q
                          q=_new_q(phi,tuple(int(round(b*1000)) for b in new['boundaries']),new_c,new['count'])
                          actual=(q>threshold_ms)
                          pred={'CERTIFIED_FIRE':True,'CERTIFIED_CLEAR':False}.get(c['status'])
                          if pred is not None and pred!=actual:
                              raise AssertionError('REAL_URLOP_ALERT_CERT_FALSE '+repr((phi,threshold_ms,c,float(q))))
                          certs.append({'phi':phi,'threshold_ms':threshold_ms,'certificate':c['status'],
                                        'observed_target_quantile_ms':float(q),'observed_alert':actual})
                  report={'test':'REAL_URLOPENTEL_INSTRUMENTATION_HTTP_DUP','status':'PASS',
                          'instrumentation_version':version('opentelemetry-instrumentation-urllib'),
                          'sdk_version':version('opentelemetry-sdk'),
                          'requests':count,'old_metric':old_name,'new_metric':new_name,
                          'old_aggregate':old,'new_aggregate':new,
                          'certificates':certs,'certified':sum(c['certificate']!='UNDECIDABLE' for c in certs),
                          'scope':'actual localhost urllib requests, same-process dual-emission; runtime timings uncontrolled; grouped across attributes',
                          'limitations':['SDK instrument data in-memory, not Prometheus scrape/rate',
                                         'labels are aggregated; only full-process total pairing is checked',
                                         'certificate applies to static totals, not arbitrary PromQL windows/resets']}
                  Path(output).write_text(json.dumps(report,indent=2,default=list))
                  print(json.dumps({'status':'PASS','requests':count,'certified':report['certified'],
                                    'total_certificates':len(certs),'old_dp':old['number_of_attribute_groups'],
                                    'new_dp':new['number_of_attribute_groups']}))
              finally:
                  instr.uninstrument()
                  server.shutdown()
                  provider.shutdown()
          
          if __name__=='__main__':
              run(os.environ.get('QSEM_REAL_OUT','out/real_urllib_dual.json'))
          PY_QSEM_SCRIPT
          cat > make_promtool.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Generate deterministic Prometheus real-engine unit tests for histogram_quantile(rate).
          
          Rule-based PromQL is evaluated by pinned external promtool binary, not by this
          local Python's percentile implementation; Python only creates expected truth.
          """
          import json
          from pathlib import Path
          import yaml
          from rounding_certificate import OldHistogram, old_from_ms,target_from_events_ms,_new_q,certify
          
          old_bounds=(0,5,10,25,50,75,100,250,500,750,1000,2500,5000,7500,10000)
          new_bounds=old_bounds[1:]
          cases={
           'lower':[4.6]*100,
           'upper':[5.4]*100,
           'low':[1.2]*100,
           'zero':[0.0]*100,
           'mixed':[1.2]*96+[4.9]*4,
           'fastslow':[4.6]*60+[25.4]*40,
          }
          series=[];expected=[];case_reports=[]
          for case,events in cases.items():
              old=old_from_ms([max(round(t),0) for t in events],old_bounds)
              new_cum=target_from_events_ms(events,old_bounds)
              n=len(events)
              for mode,edges,cum in [('old',old_bounds,old.cumulative),('new',new_bounds,new_cum)]:
                  # Old limits are milliseconds; new metric and its le labels use seconds.
                  # PromQL comparisons must preserve the corresponding units.
                  for b,c in list(zip(edges,cum))+[('+Inf',n)]:
                      limit = '+Inf' if b=='+Inf' else (format(b/1000, '.15g') if mode=='new' else str(b))
                      name=f'qsem_{mode}_bucket'
                      key=f'{name}{{scenario="{case}",le="{limit}"}}'
                      series.append({'series':key,'values':f'0 {int(c)}'})
              qold=_new_q(.95,old_bounds[1:],[old.cumulative[i] for i in range(1,len(old_bounds))],n)
              qnew=_new_q(.95,new_bounds,new_cum,n)
              expected.append({'labels':f'{{scenario="{case}"}}','value':int(qnew>7)})
              case_reports.append({'name':case,'old_p95_ms_restricted':float(qold),
                                   'new_p95_ms_restricted':float(qnew),
                                   'cert':certify(old,.95,7)['status'],
                                   'actual_alert':bool(qnew>7)})
          
          test={'rule_files':[], 'evaluation_interval':'1m', 'tests':[{
              'interval':'1m',
              'input_series':series,
              'promql_expr_test':[{'expr':'histogram_quantile(0.95, sum by (le,scenario) (rate(qsem_new_bucket[2m]))) > bool 0.007',
                                   'eval_time':'1m','exp_samples':expected},
                                  {'expr':'histogram_quantile(0.95, sum by (le,scenario) (rate(qsem_old_bucket[2m]))) > bool 7',
                                   'eval_time':'1m',
                                   'exp_samples':[{'labels':f'{{scenario="{c}"}}','value':int(r['old_p95_ms_restricted']>7)} for c,r in zip(cases,case_reports)]}
                                 ]}]}
          # These two-scrape fixtures have no resets; incomplete or reset windows
          # remain explicitly outside the certificates' scope.
          Path('out').mkdir(exist_ok=True)
          Path('out/promql_test.yml').write_text(yaml.safe_dump(test,sort_keys=False))
          Path('out/promtool_expected.json').write_text(json.dumps(case_reports,indent=2))
          synthetic_new=[s['series'] for s in series if s['series'].startswith('qsem_new_bucket{scenario="lower"')]
          observed=[s.rsplit('le="',1)[1].split('"')[0] for s in synthetic_new]
          expected=[format(b/1000,'.15g') for b in new_bounds]+['+Inf']
          assert observed==expected, 'NEW_BUCKET_UNIT_MISMATCH'
          print(json.dumps({'promtool_expected_groups':len(cases),'new_alerts':sum(x['actual_alert'] for x in case_reports)},indent=2))
          PY_QSEM_SCRIPT
          cat > temporal_guards.py <<'PY_QSEM_SCRIPT'
          #!/usr/bin/env python3
          """Fail-closed two-scrape gate for restricted Prometheus rate windows.
          
          Requires aligned, non-reset cumulative counter histograms with exactly two
          scrapes in the rate range; no missing series, label cardinality shifts, mixed
          classic/native, or timestamp skew. A monotone single interval is sufficient
          for deriving exact per-bucket increments, not general PromQL range semantics.
          """
          from rounding_certificate import OldHistogram,certify
          import json
          from pathlib import Path
          
          def delta_certificate(s0,s1,phi,threshold,window_start,window_end):
              # Input snapshots are complete and carry timestamp and old aggregate fields.
              if not (s0['timestamp']==window_start and s1['timestamp']==window_end):
                  return {'status':'UNSUPPORTED','reason':'MISALIGNED_OR_MISSING_SCRAPES'}
              if s0['bounds_ms']!=s1['bounds_ms'] or s0['labels']!=s1['labels']:
                  return {'status':'UNSUPPORTED','reason':'LAYOUT_OR_LABEL_CHANGE'}
              bounds=tuple(s0['bounds_ms'])
              if any(not isinstance(v,int) for x in [s0,s1] for v in
                     list(x['cumulative'])+[x['count'],x['sum_rounded_ms']]):
                  return {'status':'UNSUPPORTED','reason':'NONINTEGER_LEGACY_SUM_OR_BUCKET'}
              cum=[b-a for a,b in zip(s0['cumulative'],s1['cumulative'])]
              count=s1['count']-s0['count']
              summ=s1['sum_rounded_ms']-s0['sum_rounded_ms']
              if any(x<0 for x in cum+[count,summ]):
                  return {'status':'UNSUPPORTED','reason':'COUNTER_RESET_OR_INCONSISTENT_DELTA'}
              try:
                  return certify(OldHistogram(bounds,tuple(cum),count,summ),phi,threshold)
              except ValueError:
                  return {'status':'UNSUPPORTED','reason':'INVALID_DELTA_HISTOGRAM'}
          
          def tests():
              bounds=[0,5,10,25]
              a={'timestamp':0,'bounds_ms':bounds,'labels':'group_all',
                 'cumulative':[0,0,0,0],'count':0,'sum_rounded_ms':0}
              b={'timestamp':60,'bounds_ms':bounds,'labels':'group_all',
                 'cumulative':[0,100,100,100],'count':100,'sum_rounded_ms':120}
              valid=delta_certificate(a,b,.95,7,0,60)
              assert valid['status']=='CERTIFIED_CLEAR',valid
              x=dict(b,timestamp=120)
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              x=dict(b,cumulative=[0,-1,0,0])
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              x=dict(b,labels='different')
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              x=dict(b,bounds_ms=[0,5,11,25])
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              x=dict(b,sum_rounded_ms=1.5)
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              # Across same labels and count but non-monotone bucket delta: refuse.
              x=dict(b,cumulative=[0,101,100,100])
              assert delta_certificate(a,x,.95,7,0,60)['status']=='UNSUPPORTED'
              result={'status':'PASS','test_count':7,'scope':'two exact, aligned, monotone snapshots only'}
              Path('out').mkdir(exist_ok=True)
              Path('out/temporal_guard_tests.json').write_text(json.dumps(result,indent=2))
              print(json.dumps(result))
          if __name__=='__main__':tests()
          PY_QSEM_SCRIPT
          cp python_versions.txt out/
          sha256sum rounding_certificate.py test_certificate.py benchmark_certificate.py urllib_dual_real.py make_promtool.py temporal_guards.py | tee out/source_sha256.txt
      - name: Local proof oracle and independent optimizer tests
        id: oracle
        shell: bash
        run: |
          set -euo pipefail
          python test_certificate.py 2>&1 | tee out/static_tests.log
          cp static_tests.json out/
          python benchmark_certificate.py 2>&1 | tee out/comparison.log
          cp comparative_synthetic.json out/
          python temporal_guards.py 2>&1 | tee out/temporal_guard.log
          python make_promtool.py 2>&1 | tee out/promtool_cases.log
      - name: Real OpenTelemetry urllib HTTP dual-emission
        id: real
        shell: bash
        run: |
          set -euo pipefail
          QSEM_REAL_OUT=out/real_urllib_dual.json python urllib_dual_real.py 2>&1 | tee out/real_urllib.log
      - name: Download verified Prometheus promtool 3.15.1
        id: promdownload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 -o prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz 2>&1 | tee out/prometheus_download.log
          echo "6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  prometheus.tar.gz" | sha256sum -c -
          tar -xzf prometheus.tar.gz prometheus-3.15.1.linux-amd64/promtool
          mv prometheus-3.15.1.linux-amd64/promtool ./promtool
          chmod +x ./promtool
          ./promtool --version | tee out/promtool_version.txt
      - name: Replay actual urllib dual-emission histograms through PromQL
        id: promreal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_QSEM_REAL_REPLAY' 2>&1 | tee out/promtool_real_replay.log
          import json, yaml
          from pathlib import Path
          src=Path('out/real_urllib_dual.json')
          assert src.exists(), 'REAL_EMISSION_MISSING'
          actual=json.loads(src.read_text())
          assert actual.get('status')=='PASS' and actual.get('requests',0)>0
          old=actual['old_aggregate'];new=actual['new_aggregate']
          assert old['count']==new['count']==actual['requests']
          assert len(old['boundaries'])==len(new['boundaries'])+1
          assert old['boundaries'][0]==0
          for a,b in zip(old['boundaries'][1:],new['boundaries']):
              assert abs(a/1000-b)<1e-10, 'OLD_NEW_BOUNDARY_MISMATCH'
          doc=yaml.safe_load(Path('out/promql_test.yml').read_text())
          group=doc['tests'][0]
          series=group['input_series']
          for mode, hist in [('old',old),('new',new)]:
              edges=hist['boundaries']; counts=hist['counts']
              assert len(counts)==len(edges)+1
              assert sum(counts)==hist['count']
              running=0
              for edge,c in zip(list(edges)+['+Inf'],counts):
                  running += int(c)
                  limit = '+Inf' if edge=='+Inf' else format(edge,'.15g')
                  series.append({'series': f'qsem_actual_{mode}_bucket{{scenario="urllib_real",le="{limit}"}}',
                                 'values':f'0 {running}'})
              assert running==actual['requests']
          testcases=[]
          for row in actual['certificates']:
              phi=float(row['phi']); tms=float(row['threshold_ms'])
              flag=bool(row['observed_alert']);status=row['certificate']
              assert status not in ('CERTIFIED_FIRE','CERTIFIED_CLEAR') or flag==(status=='CERTIFIED_FIRE')
              expr=(f'histogram_quantile({phi:g}, sum by (le,scenario) '
                    f'(rate(qsem_actual_new_bucket[2m]))) > bool {tms/1000:.12g}')
              group['promql_expr_test'].append({'expr':expr, 'eval_time':'1m',
                 'exp_samples':[{'labels':'{scenario="urllib_real"}','value':int(flag)}]})
              testcases.append({'phi':phi,'threshold_ms':tms,'expected':int(flag),'certificate':status,'expr':expr})
          assert testcases and len(testcases)==len(actual['certificates']), 'INVALID_CERTIFICATE_GRID'
          decisive=sum(t['certificate']!='UNDECIDABLE' for t in testcases)
          assert decisive==actual['certified'], 'CERTIFICATE_COUNT_INCONSISTENT'
          # Unit regression guard for both synthetic and real Prometheus fixtures.
          for metric, edges in [('qsem_new_bucket',old['boundaries'][1:]),
                                ('qsem_actual_new_bucket',[b*1000 for b in new['boundaries']])]:
              scenario = 'lower' if metric=='qsem_new_bucket' else 'urllib_real'
              group_series=[s['series'] for s in series if s['series'].startswith(f'{metric}{{scenario="{scenario}"')]
              seen=[s.rsplit('le="',1)[1].split('"')[0] for s in group_series]
              want=[format(v/1000,'.15g') for v in edges]+['+Inf']
              assert seen==want, f'{metric}_UNIT_MISMATCH: {seen} != {want}'
          Path('out/promql_test.yml').write_text(yaml.safe_dump(doc,sort_keys=False))
          report={'status':'READY_FOR_PROMTOOL','real_requests':actual['requests'],
                  'old_unit':'milliseconds','new_unit':'seconds',
                  'real_cases':len(testcases), 'decisive':decisive,
                  'undecidable':len(testcases)-decisive,
                  'testcases':testcases,
                  'limitation':'In-memory OTel dual emission replayed as two aligned snapshots; not a production scrape'}
          Path('out/promtool_real_replay_manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='testcases'}))
          PY_QSEM_REAL_REPLAY
      - name: Run actual Prometheus PromQL histogram rate tests
        id: promql
        shell: bash
        run: |
          set -euo pipefail
          test -s out/promql_test.yml
          ./promtool test rules out/promql_test.yml 2>&1 | tee out/promtool_test.log
      - name: Summarize completeness and limitations
        if: always()
        shell: bash
        env:
          QSEM_STEP_DEPS: ${{ steps.deps.outcome }}
          QSEM_STEP_RESTORE: ${{ steps.restore.outcome }}
          QSEM_STEP_ORACLE: ${{ steps.oracle.outcome }}
          QSEM_STEP_REAL: ${{ steps.real.outcome }}
          QSEM_STEP_PROMDOWNLOAD: ${{ steps.promdownload.outcome }}
          QSEM_STEP_PROMREAL: ${{ steps.promreal.outcome }}
          QSEM_STEP_PROMQL: ${{ steps.promql.outcome }}
        run: |
          python - <<'PY_QSEM_SUMMARY'
          from pathlib import Path
          import json, os
          out=Path('out');out.mkdir(exist_ok=True)
          needed=['static_tests.json','comparative_synthetic.json','temporal_guard_tests.json','promtool_expected.json','real_urllib_dual.json','promtool_real_replay_manifest.json','promtool_real_replay.log','promtool_test.log']
          missing=[p for p in needed if not (out/p).exists() or (out/p).stat().st_size==0]
          checks={p:{'exists':(out/p).exists(),'bytes':(out/p).stat().st_size if (out/p).exists() else 0} for p in needed}
          stages={k.removeprefix('QSEM_STEP_').lower():v for k,v in os.environ.items() if k.startswith('QSEM_STEP_')}
          failed=[k for k,v in stages.items() if v!='success']
          status='PASS' if not missing and not failed else 'INCOMPLETE'
          result={'status':status,'files':checks,'missing':missing,'stage_outcomes':stages,'failed_or_skipped_stages':failed,
          'novelty_gate':'NOT_ESTABLISHED',
          'validation':'same-process urllib dual emission; deterministic PromQL via pinned promtool with unit-correct synthetic histograms and offline replay of actual urllib histograms; synthetic independent MILP/world oracle',
          'unsupported':['mixed-version selection','incomplete scrapes or counter resets','native histograms','general PromQL arithmetic or filters','remote OTel producer validation','independent production paired telemetry']}
          (out/'summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({'status':status,'missing':missing,'failed_stages':failed,'novelty_gate':result['novelty_gate']}))
          PY_QSEM_SUMMARY
      - name: Upload all evidence including failed run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QSEM_Gate03_Stable_Results
          path: out/
          if-no-files-found: error
          retention-days: 30
