                                 'mdd_nodes':result['stats']['created_nodes'],
                                 'milliseconds':result['runtime_ms']})
          results['stress']=stress;results['tests']+=1+5+len(stress)
          Path('evidence/static-pilot.json').write_text(json.dumps(results,indent=2))
          print('STATIC PILOT PASS',results['tests'],'largest virtual space',large['stats']['symbolic_state_space'])
