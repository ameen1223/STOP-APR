          #!/usr/bin/env python3
          import json,sys,traceback
          from pathlib import Path
          import selector_delta as s
          import bdd_exact as b
          root=Path('evidence')
          def load(name):return json.loads((root/name).read_text())
          def snap(name):
              pol=load('policies-'+name+'.json')['items']
              wh=[w for cfg in load('webhooks-'+name+'.json')['items'] for w in cfg.get('webhooks',[])]
              return pol,wh
          try:
              pa,ha=snap('a-alone')
              pp,hp=snap('paired')
              pg,hg=snap('with-matchcondition')
              target=next(p for p in pa if p.get('metadata',{}).get('name')=='ordersafe-a-rbac')
              twin=next(p for p in pp if p.get('metadata',{}).get('name')=='ordersafe-b-watch-configmaps')
              probe=load('probe-results.json');oldnew=load('old-new-results.json')
              d1=b.delta(target,ha,hp)
              d2=b.delta(target,ha,hg)
              checks={'A_pair':b.check(target,hp), 'A_guard':b.check(target,hg),
                      'B_pair':b.check(twin,hp), 'B_guard':b.check(twin,hg)}
              base_ok=(probe['a_alone']=='yes' and probe['b_alone']=='yes')
              observed_lost=(probe['a_alone']=='yes' and probe['a_pair']!='yes')
              predicted_lost=d1['status']=='REGRESSION_WITNESS'
              model_align=('AGREE' if base_ok and observed_lost==predicted_lost else
                           'INCONCLUSIVE_BASELINE' if not base_ok else 'DISAGREE')
              guard_ok=(probe['a_guard']=='yes' and probe['b_guard']=='yes'
                        and d2['status']=='NO_REGRESSION_IN_SUPPORTED_MODEL')
              oldnew_ok=(oldnew['old_true_new_false']=='yes' and oldnew['old_false_new_true']=='yes')
              data={'model_runtime_agreement':model_align,'baseline_valid':base_ok,
                    'pair_observed_loss':observed_lost,'pair_predicted_loss':predicted_lost,
                    'guarded_control_pass':guard_ok,'old_new_k8s_semantics_pass':oldnew_ok,
                    'model_delta_pair':d1,'model_delta_guarded':d2,'model_prefilter_checks':checks,
                    'scope':'admission selector prefilter and observable mutation probe, not general CEL verification',
                    'novelty_gate':'NOT_ESTABLISHED'}
          except Exception as ex:
              data={'model_runtime_agreement':'INCONCLUSIVE_ERROR','reason':str(ex),'traceback':traceback.format_exc(),
                    'novelty_gate':'NOT_ESTABLISHED'}
          root.joinpath('causal-algorithm-analysis.json').write_text(json.dumps(data,indent=2,sort_keys=True))
          print('Causal model-v-runtime:',data['model_runtime_agreement'])
          PY_ORDERSAFE_POSTCHECK_PY
          python -m py_compile research/*.py
          PYTHONPATH=research python research/ordersafe_static.py
      - name: Create isolated Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          kubectl_version: v1.35.5
          node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          cluster_name: ordersafe-causal
          wait: 180s
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - name: Run identical admission-policy fixtures
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          mkdir -p evidence
          phase=starting
          status=BLOCKED_OR_FAILED
          reason=NOT_COMPLETED
          runtime_verified=false
          finish() {
            local rc=$?
            if [ "$status" = BLOCKED_OR_FAILED ]; then reason="ERROR_IN_${phase}"; fi
            jq -n --arg status "$status" --arg reason "$reason" --arg phase "$phase" \
              --argjson exit_code "$rc" --argjson runtime_verified "$runtime_verified" \
              '{status:$status, reason:$reason, phase:$phase, exit_code:$exit_code, runtime_verified:$runtime_verified}' \
              > evidence/summary.json
            echo "ORDER_SAFE_STATUS=$status; REASON=$reason; PHASE=$phase; EXIT=$rc"
          }
          trap finish EXIT
          
          # Real, isolated Kubernetes and Kyverno runtime; no existing user cluster is touched.
          phase=cluster_preflight
          kubectl version -o json > evidence/kubernetes-version.json
          kubectl get nodes -o wide > evidence/nodes.txt
          helm version --short > evidence/helm-version.txt
          
          phase=install_kyverno
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update kyverno
          helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace \
            --version "${{ matrix.kyverno_chart }}" --wait --timeout 12m
          helm list -n kyverno -o json > evidence/helm-releases.json
          kubectl get pods -n kyverno -o wide > evidence/kyverno-pods.txt
          kubectl wait --for=condition=Established --timeout=120s crd/mutatingpolicies.policies.kyverno.io
          
          phase=create_test_namespace
          NS=ordersafe-gate
          kubectl create namespace "$NS"
          
          # Policy B: mutate UPDATE on specifically labeled ConfigMaps.
          cat > /tmp/ordersafe-policy-b.yaml <<'POLICY_B'
          apiVersion: policies.kyverno.io/v1
          kind: MutatingPolicy
          metadata:
            name: ordersafe-b-watch-configmaps
          spec:
            failurePolicy: Fail
            matchConstraints:
              resourceRules:
                - apiGroups: ['']
                  apiVersions: ['v1']
                  operations: ['UPDATE']
                  resources: ['configmaps']
              objectSelector:
                matchLabels:
                  ordersafe.io/watch: 'true'
            mutations:
              - patchType: ApplyConfiguration
                applyConfiguration:
                  expression: >
                    Object{
                      metadata: Object.metadata{
                        annotations: {"ordersafe.io/mut-b": "yes"}
                      }
                    }
          POLICY_B
          
          # Policy A: distinct resource rules and objectSelector, as in the reported issue.
          cat > /tmp/ordersafe-policy-a.yaml <<'POLICY_A'
          apiVersion: policies.kyverno.io/v1
          kind: MutatingPolicy
          metadata:
            name: ordersafe-a-rbac
          spec:
            failurePolicy: Fail
            matchConstraints:
              resourceRules:
                - apiGroups: ['rbac.authorization.k8s.io']
                  apiVersions: ['v1']
                  operations: ['CREATE', 'UPDATE']
                  resources: ['roles', 'rolebindings']
              objectSelector:
                matchLabels:
                  app.kubernetes.io/component: 'runner-scale-set-listener'
            mutations:
              - patchType: ApplyConfiguration
                applyConfiguration:
                  expression: >
                    Object{
                      metadata: Object.metadata{
                        annotations: {"ordersafe.io/mut-a": "yes"}
                      }
                    }
          POLICY_A
          
          cp /tmp/ordersafe-policy-a.yaml evidence/policy-a.yaml
          cp /tmp/ordersafe-policy-b.yaml evidence/policy-b.yaml
          
          hook_has() {
            kubectl get mutatingwebhookconfigurations -o json | jq -e --arg p "$1" \
              '[.items[]? | .webhooks[]? | (.clientConfig.service.path // "") | select(contains($p))] | length > 0' \
              >/dev/null
          }
          wait_hook_present() {
            for i in $(seq 1 36); do
              if hook_has "$1"; then sleep 5; return 0; fi
              sleep 5
            done
            echo "Missing expected webhook path for policy: $1" >&2
            return 1
          }
          wait_hook_absent() {
            for i in $(seq 1 36); do
              if ! hook_has "$1"; then sleep 5; return 0; fi
              sleep 5
            done
            echo "Webhook path for removed policy still present: $1" >&2
            return 1
          }
          snapshot() {
            kubectl get mutatingwebhookconfigurations -o json > "evidence/webhooks-$1.json"
            kubectl get mutatingpolicies.policies.kyverno.io -o json > "evidence/policies-$1.json"
          }
          make_cm() {
            local name="$1" watch="$2"
            cat <<EOF | kubectl -n "$NS" apply -f - >/dev/null
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: $name
            labels:
              ordersafe.io/watch: '$watch'
          data:
            phase: before
          EOF
          }
          make_role() {
            local name="$1"
            cat <<EOF | kubectl -n "$NS" apply -f - >/dev/null
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: $name
            labels:
              app.kubernetes.io/component: runner-scale-set-listener
          rules: []
          EOF
          }
          probe_b() {
            local name="$1"
            make_cm "$name" true
            kubectl -n "$NS" patch configmap "$name" --type=merge -p '{"data":{"phase":"after"}}' \
              > "evidence/patch-$name.txt"
            kubectl -n "$NS" get configmap "$name" -o json > "evidence/object-$name.json"
            jq -r '.metadata.annotations["ordersafe.io/mut-b"] // "none"' "evidence/object-$name.json"
          }
          probe_a() {
            local name="$1"
            make_role "$name"
            kubectl -n "$NS" get role "$name" -o json > "evidence/object-$name.json"
            jq -r '.metadata.annotations["ordersafe.io/mut-a"] // "none"' "evidence/object-$name.json"
          }
          
          phase=baseline_b
          kubectl apply -f /tmp/ordersafe-policy-b.yaml
          wait_hook_present ordersafe-b-watch-configmaps
          snapshot b-alone
          b_alone=$(probe_b ordersafe-b-alone)
          echo "BASELINE_B=$b_alone"
          
          phase=baseline_a
          kubectl delete -f /tmp/ordersafe-policy-b.yaml --wait=true
          wait_hook_absent ordersafe-b-watch-configmaps
          kubectl apply -f /tmp/ordersafe-policy-a.yaml
          wait_hook_present ordersafe-a-rbac
          snapshot a-alone
          a_alone=$(probe_a ordersafe-a-alone)
          echo "BASELINE_A=$a_alone"
          
          phase=paired_policies
          kubectl apply -f /tmp/ordersafe-policy-b.yaml
          wait_hook_present ordersafe-b-watch-configmaps
          snapshot paired
          b_pair=$(probe_b ordersafe-b-pair)
          a_pair=$(probe_a ordersafe-a-pair)
          echo "PAIR_B=$b_pair; PAIR_A=$a_pair"
          
          phase=workaround_control
          kubectl patch mutatingpolicy ordersafe-b-watch-configmaps --type=merge \
            -p '{"spec":{"matchConditions":[{"name":"force-separate-hook","expression":"true"}]}}'
          # Allow the controller and Kubernetes API server time to publish updated webhook match conditions.
          sleep 20
          snapshot with-matchcondition
          b_guard=$(probe_b ordersafe-b-guard)
          a_guard=$(probe_a ordersafe-a-guard)
          echo "GUARD_B=$b_guard; GUARD_A=$a_guard"
          
          phase=negative_selector_control
          make_cm ordersafe-b-negative false
          kubectl -n "$NS" patch configmap ordersafe-b-negative --type=merge \
            -p '{"data":{"phase":"after"}}' > evidence/patch-negative.txt
          kubectl -n "$NS" get configmap ordersafe-b-negative -o json > evidence/object-negative.json
          negative=$(jq -r '.metadata.annotations["ordersafe.io/mut-b"] // "none"' evidence/object-negative.json)
          echo "NEGATIVE_B=$negative"
          
          
          phase=old_new_semantics
          make_cm ordersafe-b-oldtrue true
          kubectl -n "$NS" patch configmap ordersafe-b-oldtrue --type=merge \
            -p '{"metadata":{"labels":{"ordersafe.io/watch":"false"}}}' > evidence/patch-oldtrue.txt
          kubectl -n "$NS" get configmap ordersafe-b-oldtrue -o json > evidence/object-oldtrue.json
          old_true=$(jq -r '.metadata.annotations["ordersafe.io/mut-b"] // "none"' evidence/object-oldtrue.json)
          make_cm ordersafe-b-newtrue false
          kubectl -n "$NS" patch configmap ordersafe-b-newtrue --type=merge \
            -p '{"metadata":{"labels":{"ordersafe.io/watch":"true"}}}' > evidence/patch-newtrue.txt
          kubectl -n "$NS" get configmap ordersafe-b-newtrue -o json > evidence/object-newtrue.json
          new_true=$(jq -r '.metadata.annotations["ordersafe.io/mut-b"] // "none"' evidence/object-newtrue.json)
          jq -n --arg old_true "$old_true" --arg new_true "$new_true" \
            '{old_true_new_false:$old_true,old_false_new_true:$new_true}' > evidence/old-new-results.json
          
          phase=decision
          printf 'stage\tA_mutated\tB_mutated\nB_only\tNA\t%s\nA_only\t%s\tNA\nA_plus_B\t%s\t%s\nA_plus_B_guard\t%s\t%s\nnegative_label\tNA\t%s\n' \
            "$b_alone" "$a_alone" "$a_pair" "$b_pair" "$a_guard" "$b_guard" "$negative" \
            > evidence/stage-results.tsv
          jq -n --arg b_alone "$b_alone" --arg a_alone "$a_alone" \
            --arg b_pair "$b_pair" --arg a_pair "$a_pair" \
            --arg b_guard "$b_guard" --arg a_guard "$a_guard" --arg negative "$negative" \
            '{b_alone:$b_alone,a_alone:$a_alone,b_pair:$b_pair,a_pair:$a_pair,b_guard:$b_guard,a_guard:$a_guard,negative:$negative}' \
            > evidence/probe-results.json
          runtime_verified=true
          if [ "$a_alone" != yes ] || [ "$b_alone" != yes ]; then
            status=INCONCLUSIVE_BASELINE
            reason=ONE_OR_BOTH_POLICIES_FAILED_ALONE
          elif [ "$negative" != none ]; then
            status=INCONCLUSIVE_SELECTOR
            reason=NEGATIVE_CONTROL_WAS_MUTATED
          elif [ "$a_pair" = yes ] && [ "$b_pair" = yes ]; then
            status=NO_COMPOSITION_DEFECT_OBSERVED
            reason=BOTH_POLICIES_MUTATED_IN_PAIR
          elif [ "$a_guard" = yes ] && [ "$b_guard" = yes ]; then
            status=COMPOSITION_DEFECT_REPRODUCED
            reason=PAIR_LOST_MUTATION_AND_MATCHCONDITION_RESTORED_IT
          else
            status=INCONCLUSIVE_COMPOSITION_FAILURE
            reason=PAIR_FAILED_BUT_WORKAROUND_DID_NOT_RECOVER_BOTH
          fi
          echo "Scientific classification: $status"
      - name: Verify causal delta and match runtime
