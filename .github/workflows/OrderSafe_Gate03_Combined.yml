          #!/usr/bin/env python3
          """Independent randomized checks and measured (not extrapolated) baselines."""
          import json,random,time,statistics,sys
          from pathlib import Path
          import selector_delta as s
          import bdd_exact as b
          rng=random.Random(20261027)
          results={'seed':20261027,'tests':0,'scope':'namespaced exact tuple matching, selectors, CREATE/UPDATE'}
          def rand_sel():
              es=[]
              for _ in range(rng.randint(0,3)):
                  op=rng.choice(['In','NotIn','Exists','DoesNotExist'])
                  es.append({'key':rng.choice(['x','y','z']),'operator':op,
                             'values':[rng.choice(['v','w'])] if op in ('In','NotIn') else []})
              return {'matchExpressions':es}
          for op in ('CREATE','UPDATE'):
              for _ in range(400):
                  pol=s.p('P','configmaps',op,rand_sel(),rand_sel())
                  hooks=[s.h(['P'],'configmaps',op,rand_sel(),rand_sel()) for _ in range(rng.randint(0,3))]
                  expect=s.small_brute(pol,hooks)
                  got=b.check(pol,hooks)['status']=='UNREACHABLE_PREFILTER'
                  assert got==expect, ('MDD-vs-exhaustive',op,pol,hooks)
                  results['tests']+=1
          # Gate02 bounded enumerator stops above 200,000 states; the MDD never enumerates.
          labels={'k'+str(i):'v'+str(i) for i in range(18)}
          pol=s.p('large','configmaps','UPDATE',{'matchLabels':labels})
          hooks=[s.h(['large'],'configmaps','UPDATE',{'matchLabels':{'k0':'z'}})]
          large=b.check(pol,hooks)
          assert large['status']=='UNREACHABLE_PREFILTER'
          assert large['stats']['symbolic_state_space'] > 10**15
          results['large_state_case']=large
          # Five binary-size baseline comparisons against pure exhaustive enumeration.
          rows=[]
          for n in range(1,6):
              x={f'k{i}':'v' for i in range(n)}
              p=s.p('base','configmaps','UPDATE',{'matchLabels':x})
              hs=[s.h(['base'],'configmaps','UPDATE',{'matchLabels':x})]
              t=time.perf_counter();expect=s.small_brute(p,hs);brute=(time.perf_counter()-t)*1000
              t=time.perf_counter();got=b.check(p,hs);comp=(time.perf_counter()-t)*1000
              assert expect is False and got['status']=='COVERED_IN_SUPPORTED_MODEL'
              rows.append({'keys':n,'states':got['stats']['symbolic_state_space'],
                           'exhaustive_ms':round(brute,5),'mdd_ms':round(comp,5)})
          results['baseline_comparison']=rows
          # Adversarial but supported selectors with up to 30 keys and 32 overlapping hooks.
          stress=[]
          for n in (4,8,12,20,30):
              for count in (2,8,16,32):
                  p=s.p('P','configmaps','UPDATE',{'matchLabels':{'x0':'v'}})
                  hs=[]
                  for _ in range(count):
                      expressions=[]
                      for key in rng.sample([f'x{i}' for i in range(n)],rng.randint(1,min(n,4))):
                          op=rng.choice(['In','NotIn','Exists','DoesNotExist'])
                          expressions.append({'key':key,'operator':op,
                            'values':[rng.choice(['v','z'])] if op in ('In','NotIn') else []})
                      hs.append(s.h(['P'],'configmaps','UPDATE',{'matchExpressions':expressions}))
                  result=b.check(p,hs)
