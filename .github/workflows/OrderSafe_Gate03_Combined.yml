# OrderSafe Gate03. One workflow, two EXACTLY MATCHED Kyverno versions.
# Same policy YAML, same Kubernetes node image, same probes, isolated runners.
# Does not modify any existing user cluster. Analysis is prefilter-only.
name: OrderSafe Gate03 Causal Delta and Matched Engine
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kyverno_chart: ['3.8.1', '3.9.2']
    steps:
      - name: Create evidence folder
        shell: bash
        run: mkdir -p evidence research
      - name: Create exact local symbolic analyzers
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p research evidence
          cat > research/selector_delta.py <<'PY_SELECTOR_DELTA_PY'
          #!/usr/bin/env python3
          """Selector delta pilot: exact bounded-grammar, unbounded label dimensionality.
          
          Scope: namespaced exact resource/API/operations (CREATE or UPDATE); Kubernetes
          LabelSelectors on namespace and old/new objects; inspected Kyverno /mpol/ routes.
          Unlike a Kubernetes runtime verifier, this detects potential prefilter bypasses;
          actual changes require an engine. Unknown CEL and non-exact rules fail closed.
          
          Representation: symbolic finite domains partitioned by literal values, absent and
          an OTHER equivalence class, with recursive disjoint hyperrectangle subtraction.
          """
          from __future__ import annotations
          import argparse
          import json
          import random
          import time
          import zipfile
          from collections import Counter
          from dataclasses import dataclass
          from itertools import product
          from pathlib import Path
          
          MISSING='<ABSENT>'
          OTHER='<OTHER>'
          
          class Unsupported(Exception): pass
          
          # Explicitly namespaced resource types only; requests for unknown/cluster-scoped
          # resources are not covered by this model without discovery-schema evidence.
          NAMESPACED_RESOURCES = {
              'configmaps','secrets','pods','services','serviceaccounts','endpoints',
              'persistentvolumeclaims','resourcequotas','limitranges','events',
              'roles','rolebindings','deployments','replicasets','statefulsets',
              'daemonsets','jobs','cronjobs','ingresses','networkpolicies',
              'horizontalpodautoscalers'
          }
          
          def validate_match(m):
              if not isinstance(m,dict): raise Unsupported('malformed matchConstraints')
              if set(m)-{'resourceRules','objectSelector','namespaceSelector','matchPolicy'}:
                  raise Unsupported('unmodeled matchConstraints field')
              if m.get('matchPolicy','Equivalent') not in ('Exact','Equivalent'):
                  raise Unsupported('unsupported matchPolicy')
          
          def api_maybe_match(hook,api):
              """Overapproximate Equivalent-version routing, avoiding false gap witnesses."""
              api_set=tuples(hook['rules'])
              if api in api_set:return True
              if hook.get('matchPolicy','Equivalent') == 'Equivalent':
                  return any(x[2:]==api[2:] for x in api_set)
              return False
          
          
          def kvs(sel):
              if sel is None: return {}
              if not isinstance(sel,dict) or set(sel)-{'matchLabels','matchExpressions'}:
                  raise Unsupported('unsupported selector structure')
              out={}
              for k,v in (sel.get('matchLabels') or {}).items():
                  if not isinstance(k,str) or not isinstance(v,str): raise Unsupported('invalid matchLabels')
                  out.setdefault(k,set()).add(v)
              for ex in sel.get('matchExpressions') or []:
                  k,op,vals=ex.get('key'),ex.get('operator'),ex.get('values',[])
                  if not isinstance(k,str) or op not in {'In','NotIn','Exists','DoesNotExist'} or not isinstance(vals,list) or any(not isinstance(x,str) for x in vals):
                      raise Unsupported('unsupported expression')
                  if op in ('Exists','DoesNotExist') and vals: raise Unsupported('unexpected values for operator')
                  if op in ('In','NotIn') and not vals: raise Unsupported('empty In/NotIn')
                  out.setdefault(k,set()).update(vals)
              return out
          
          
          def truth(sel, labels):
              if sel is None: return True
              kvs(sel)
              for k,v in (sel.get('matchLabels') or {}).items():
                  if labels.get(k,MISSING)!=v: return False
              for e in (sel.get('matchExpressions') or []):
                  k,op,vals=e['key'],e['operator'],e.get('values',[])
                  x=labels.get(k,MISSING)
                  if op=='In' and x not in vals: return False
                  if op=='NotIn' and x in vals: return False
                  if op=='Exists' and x==MISSING: return False
                  if op=='DoesNotExist' and x!=MISSING: return False
              return True
          
          
          def has_unsupported_conditions(obj):
              for x in obj.get('matchConditions') or []:
                  if x.get('expression','').strip()!='true':
                      raise Unsupported('nontrivial CEL not modeled')
          
          
          def tuples(rules):
              if not rules: raise Unsupported('empty resourceRules')
              res=set()
              for r in rules:
                  if r.get('resourceNames') or r.get('excludeResourceRules'): raise Unsupported('resourceNames/exclusions not modeled')
                  if r.get('scope','*') not in ('*','Namespaced'): raise Unsupported('cluster resource scope')
                  for k in ('apiGroups','apiVersions','resources','operations'):
                      if not isinstance(r.get(k),list) or not r[k]: raise Unsupported('empty '+k)
                  for group,version,resource,operation in product(r['apiGroups'],r['apiVersions'],r['resources'],r['operations']):
                      if resource not in NAMESPACED_RESOURCES: raise Unsupported('unknown-or-cluster-scoped resource: '+resource)
                      if operation not in ('CREATE','UPDATE') or not all(isinstance(s,str) and s and '*' not in s and '/' not in s for s in (version,resource,operation)) or '*' in group:
                          raise Unsupported('wildcard/subresource/unsupported operation')
                      res.add((group,version,resource,operation))
              return sorted(res)
          
          
          @dataclass
          class CubeStats:
              intersections: int=0
              fragments: int=0
              peak_cubes: int=0
              state_space: int=0
          
          
          class Symbolic:
              def __init__(self, selectors, operation, namespace, max_boxes=100000):
                  self.operation=operation
                  self.namespace=namespace
                  self.max_boxes=max_boxes
                  keys={}
                  for origin,s in selectors:
                      for k,v in kvs(s).items():
                          keys.setdefault((origin,k),set()).update(v)
                  keys[('ns','kubernetes.io/metadata.name')] = keys.get(('ns','kubernetes.io/metadata.name'),set())|{namespace}
                  self.dims=sorted(keys)
                  self.dom={}
                  for dim,v in keys.items():
                      vs=[MISSING]+sorted(v)
                      other=OTHER
                      while other in vs: other+='-x'
                      vs.append(other)
                      if dim==('ns','kubernetes.io/metadata.name'): vs=[namespace]
                      self.dom[dim]=frozenset(vs)
                  self.stats=CubeStats()
                  n=1
                  for d in self.dims: n*=len(self.dom[d])
                  self.stats.state_space=n
          
              def restrict(self,selector,origin):
                  # Use all-dimensional cube so disjoint difference is straightforward.
                  c={d:self.dom[d] for d in self.dims}
                  if selector is None: return c
                  for k,v in (selector.get('matchLabels') or {}).items():
                      d=(origin,k)
                      if d not in c: raise Unsupported('key domain missing')
                      c[d]=c[d].intersection([v])
                  for e in (selector.get('matchExpressions') or []):
                      d=(origin,e['key']); op=e['operator']; values=e.get('values') or []
                      if op=='In': c[d]=c[d].intersection(values)
                      elif op=='NotIn': c[d]=c[d]-set(values)
                      elif op=='Exists': c[d]=c[d]-{MISSING}
                      elif op=='DoesNotExist': c[d]=c[d].intersection([MISSING])
                  return {k:frozenset(v) for k,v in c.items()}
          
              def intersect(self,a,b):
                  self.stats.intersections+=1
                  c={d:a[d]&b[d] for d in self.dims}
                  return c if all(c.values()) else None
          
              def subtract(self,a,b):
                  intersection=self.intersect(a,b)
                  if intersection is None: return [a]
                  pieces=[]
                  prefix={}
                  for d in self.dims:
                      extra=a[d]-intersection[d]
                      if extra:
                          piece=dict(a)
                          piece.update(prefix)
                          piece[d]=extra
                          pieces.append(piece)
                      prefix[d]=intersection[d]
                  self.stats.fragments+=len(pieces)
                  return pieces
          
              def dnf(self, ns_selector, obj_selector):
                  n=self.restrict(ns_selector,'ns')
                  news=self.restrict(obj_selector,'new')
                  if self.operation=='CREATE':
                      cube=self.intersect(n,news)
                      return [cube] if cube else []
                  olds=self.restrict(obj_selector,'old')
                  return [cube for cube in (self.intersect(n,news),self.intersect(n,olds)) if cube]
          
              def diff(self,baselines,coverage):
                  remaining=list(baselines)
                  for cv in coverage:
                      nxt=[]
                      for p in remaining: nxt.extend(self.subtract(p,cv))
                      remaining=nxt
                      self.stats.peak_cubes=max(self.stats.peak_cubes,len(remaining))
                      if len(remaining)>self.max_boxes: raise Unsupported('symbolic cube expansion limit exceeded')
                      if not remaining: return []
                  return remaining
          
              def pick(self,cubes):
                  def value_key(v): return (v!=MISSING, v==OTHER, str(v))
                  def choose(c): return {d:min(c[d],key=value_key) for d in self.dims}
                  def cost(values):
                      return (sum(v!=MISSING for d,v in values.items() if d[0]!='ns'),
                              sum(v==OTHER for v in values.values()),
                              tuple(str(values[d]) for d in self.dims))
                  best=min((choose(c) for c in cubes),key=cost)
                  def labels(pos):
                      return {k:v for (p,k),v in best.items() if p==pos and v!=MISSING}
                  return {'namespace_labels':labels('ns'), 'new_labels':labels('new'),
                          'old_labels':labels('old') if self.operation=='UPDATE' else None,
                          'minimal_present_labels':cost(best)[0]}
          
          
          def attached(policy,hooks):
              name=policy['metadata']['name']
              result=[]
              for w in hooks:
                  path=w.get('clientConfig',{}).get('service',{}).get('path','')
                  bits=path.split('/')
                  if len(bits)>=3 and bits[1]=='mpol' and name in bits[2:]: result.append(w)
              return result
          
          
          def check(policy, hooks, namespace='ordersafe-gate', max_boxes=100000):
              spec=policy.get('spec',{})
              match=spec.get('matchConstraints') or {}
              has_unsupported_conditions(spec)
              validate_match(match)
              apis=tuples(match.get('resourceRules'))
              candidates=attached(policy,hooks)
              for w in candidates:
                  has_unsupported_conditions(w)
                  tuples(w.get('rules'))
              objsel=match.get('objectSelector')
              nssel=match.get('namespaceSelector')
              allsels=[('ns',nssel),('new',objsel)]
              if any(op[-1]=='UPDATE' for op in apis): allsels.append(('old',objsel))
              for w in candidates:
                  allsels.extend([('ns',w.get('namespaceSelector')),('new',w.get('objectSelector'))])
                  if any(op[-1]=='UPDATE' for op in apis): allsels.append(('old',w.get('objectSelector')))
              t0=time.perf_counter()
              for api in apis:
                  sym=Symbolic(allsels,api[-1],namespace,max_boxes=max_boxes)
                  intent=sym.dnf(nssel,objsel)
                  cover=[]
                  for w in candidates:
                      if api_maybe_match(w,api): cover.extend(sym.dnf(w.get('namespaceSelector'),w.get('objectSelector')))
                  residual=sym.diff(intent,cover)
                  if residual:
                      witness=sym.pick(residual)
                      # The returned witness is exact within modeled request-matching language.
                      assert (truth(nssel,witness['namespace_labels']) and
                              (truth(objsel,witness['new_labels']) or (witness['old_labels'] is not None and truth(objsel,witness['old_labels']))))
                      for w in candidates:
                          if not api_maybe_match(w,api): continue
                          assert not (truth(w.get('namespaceSelector'),witness['namespace_labels']) and
                                 (truth(w.get('objectSelector'),witness['new_labels']) or
                                   (witness['old_labels'] is not None and truth(w.get('objectSelector'),witness['old_labels']))))
                      return {'status':'UNREACHABLE_PREFILTER','api':api,'witness':witness,'runtime_ms':round((time.perf_counter()-t0)*1000,5),
                              'stats':vars(sym.stats),'connected_hooks':len(candidates),'scope':'selector-prefilter,not-mutation'}
              return {'status':'COVERED_IN_SUPPORTED_MODEL', 'runtime_ms':round((time.perf_counter()-t0)*1000,5),
                      'stats':vars(sym.stats),'connected_hooks':len(candidates),'scope':'selector-prefilter,not-mutation'}
          
          
          def p(name,resource,op,selector=None,nssel=None):
              return {'metadata':{'name':name},'spec':{'matchConstraints':{'resourceRules':[{'apiGroups':[''],'apiVersions':['v1'],'operations':[op],'resources':[resource]}], 'objectSelector':selector,'namespaceSelector':nssel}}}
          
          
          def h(names,resource,op,selector=None,nssel=None):
              return {'clientConfig':{'service':{'path':'/mpol/'+'/'.join(names)}},'rules':[{'apiGroups':[''],'apiVersions':['v1'],'operations':[op],'resources':[resource]}], 'objectSelector':selector,'namespaceSelector':nssel}
          
          
          def small_brute(policy, hooks):
              spec=policy['spec']; match=spec['matchConstraints']; api=tuples(match['resourceRules'])[0]; hs=attached(policy,hooks)
              sels=[match.get('objectSelector')]+[w.get('objectSelector') for w in hs]
              nsels=[match.get('namespaceSelector')]+[w.get('namespaceSelector') for w in hs]
              def vars_for(sels):
                  vals={}
                  for s in sels:
                      for k,v in kvs(s).items(): vals.setdefault(k,set()).update(v)
                  return {k:[MISSING]+sorted(v)+[OTHER] for k,v in vals.items()}
              od=vars_for(sels); nd=vars_for(nsels)
              nd['kubernetes.io/metadata.name']=['ordersafe-gate']
              def assignments(dom):
                  keys=sorted(dom)
                  for row in product(*(dom[k] for k in keys)):
                      yield {k:v for k,v in zip(keys,row) if v!=MISSING}
              for ns in assignments(nd):
                  for new in assignments(od):
                      for old in ([None] if api[-1]=='CREATE' else list(assignments(od))):
                          if not truth(match.get('namespaceSelector'),ns): continue
                          if not (truth(match.get('objectSelector'),new) or (old is not None and truth(match.get('objectSelector'),old))):continue
                          if any(api in tuples(w['rules']) and truth(w.get('namespaceSelector'),ns) and (truth(w.get('objectSelector'),new) or (old is not None and truth(w.get('objectSelector'),old))) for w in hs):continue
                          return True
              return False
          
          
          def selftest():
              t0=time.perf_counter(); n=0; rng=random.Random(20261027)
              ops=['In','NotIn','Exists','DoesNotExist']
              def sel_random():
                  entries=[]
                  for _ in range(rng.randint(0,3)):
                      key=rng.choice(['team','tier','owner']); op=rng.choice(ops)
                      if op in ('Exists','DoesNotExist'): v=[]
                      else: v=[rng.choice(['a','b','c'])]
                      entries.append({'key':key,'operator':op,'values':v})
                  return {'matchExpressions':entries}
              for op in ('CREATE','UPDATE'):
                  for i in range(400):
                      pol=p('trial','configmaps',op,sel_random(),sel_random())
                      hooks=[h(['trial'],'configmaps',op,sel_random(),sel_random()) for _ in range(rng.randint(0,3))]
                      got=check(pol,hooks)['status']=='UNREACHABLE_PREFILTER'
                      expected=small_brute(pol,hooks)
                      if got!=expected: raise AssertionError(('unsound',op,i,got,expected,pol,hooks))
                      n+=1
              huge={f'label{i}':f'value{i}' for i in range(18)}
              big=p('big','configmaps','UPDATE',{'matchLabels':huge})
              hooks=[h(['big'],'configmaps','UPDATE',{'matchLabels':{'label0':'other'}})]
              result=check(big,hooks)
              assert result['status']=='UNREACHABLE_PREFILTER'
              assert result['stats']['state_space'] > 10**12
              n+=1
              b=p('b','configmaps','CREATE',{'matchLabels':{'t':'a'}})
              assert check(b,[h(['b'],'configmaps','CREATE',None)])['status']=='COVERED_IN_SUPPORTED_MODEL'
              assert check(b,[h(['b'],'secrets','CREATE',None)])['status']=='UNREACHABLE_PREFILTER'
              n+=2
              return {'tests':n,'elapsed_sec':round(time.perf_counter()-t0,4),'large_state_case':result}
          
          
          def audit_evidence(zip_path):
              with zipfile.ZipFile(zip_path) as z:
                  names=z.namelist()
                  if 'policies-paired.json' in names:
                      cases=[('pair','policies-paired.json','webhooks-paired.json'),('separated','policies-with-matchcondition.json','webhooks-with-matchcondition.json')]
                  else:
                      cases=[('pair','paired-policies.json','paired-webhooks.json'),('guarded','guarded-policies.json','guarded-webhooks.json')]
                  results={}
                  for label,pf,wf in cases:
                      policies=json.loads(z.read(pf))['items']
                      hooks=[w for cfg in json.loads(z.read(wf))['items'] for w in cfg.get('webhooks',[])]
                      results[label]={p['metadata']['name']:check(p,hooks) for p in policies if p.get('kind')=='MutatingPolicy'}
                  return results
          
          
          def main():
              ap=argparse.ArgumentParser();ap.add_argument('--gate01');ap.add_argument('--gate02');ap.add_argument('--out',default='ordersafe_symbolic_results.json')
              a=ap.parse_args()
              result={'algorithm':'exact selector cubes with disjoint subtraction','limitations':'namespaced exact resources; no nontrivial CEL; no mutation semantics'}
              result['local_selftest']=selftest()
              if a.gate01: result['gate01']=audit_evidence(a.gate01)
              if a.gate02: result['gate02']=audit_evidence(a.gate02)
              Path(a.out).write_text(json.dumps(result,indent=2,sort_keys=True))
              print('WROTE',a.out,'SELFTESTS',result['local_selftest']['tests'],'TIME',result['local_selftest']['elapsed_sec'])
              for phase in ('gate01','gate02'):
                  for name,cases in result.get(phase,{}).items():
                      print(phase,name,{p:x['status'] for p,x in cases.items()})
          
          if __name__=='__main__': main()
          PY_SELECTOR_DELTA_PY
          cat > research/bdd_exact.py <<'PY_BDD_EXACT_PY'
          #!/usr/bin/env python3
          """Reduced ordered multi-valued decision diagram (ROMDD) for selector coverage.
          
          Uses exact finite predicate abstraction for Kubernetes selectors; detects prefilter
          unreachability. Does not model webhook backend, nontrivial CEL, or mutations.
          """
          from __future__ import annotations
          import sys,time,json,argparse
          from pathlib import Path
          import selector_delta as s
          
          class MDD:
              def __init__(self,sym,max_nodes=300000):
                  self.sym=sym
                  self.dims=sym.dims
                  self.dom=[tuple(sorted(sym.dom[d],key=str)) for d in self.dims]
                  self.nodes=[None,None]
                  self.unique={}
                  self.apply_cache={}
                  self.neg_cache={0:1,1:0}
                  self.max_nodes=max_nodes
                  self.apply_calls=0
              def mk(self,dim, children):
                  children=tuple(children)
                  if all(c==children[0] for c in children): return children[0]
                  k=(dim,children)
                  if k not in self.unique:
                      if len(self.nodes)>=self.max_nodes:raise s.Unsupported('MDD node cap reached')
                      idx=len(self.nodes);self.nodes.append(k);self.unique[k]=idx
                  return self.unique[k]
              def lev(self,n): return self.nodes[n][0] if n>1 else len(self.dims)
              def child(self,n,i,option):
                  if self.lev(n)==i:
                      return self.nodes[n][1][option]
                  return n
              def negate(self,n):
                  if n in self.neg_cache:return self.neg_cache[n]
                  i,children=self.nodes[n];v=self.mk(i,[self.negate(ch) for ch in children]);self.neg_cache[n]=v;return v
              def apply(self,op,a,b):
                  self.apply_calls+=1
                  if op=='and':
                      if a==0 or b==0:return 0
                      if a==1:return b
                      if b==1:return a
                      if a==b:return a
                  elif op=='or':
                      if a==1 or b==1:return 1
                      if a==0:return b
                      if b==0:return a
                      if a==b:return a
                  if b<a:a,b=b,a
                  k=(op,a,b)
                  if k in self.apply_cache:return self.apply_cache[k]
                  i=min(self.lev(a),self.lev(b))
                  out=self.mk(i,[self.apply(op,self.child(a,i,j),self.child(b,i,j)) for j in range(len(self.dom[i]))])
                  self.apply_cache[k]=out
                  return out
              def union(self,root,other):return self.apply('or',root,other)
              def intersection(self,a,b):return self.apply('and',a,b)
              def cube(self,allowed):
                  root=1
                  for idx in reversed(range(len(self.dims))):
                      dim=self.dims[idx]
                      vs=allowed[dim]
                      if vs==self.sym.dom[dim]:continue
                      root=self.mk(idx,[root if v in vs else 0 for v in self.dom[idx]])
                  return root
              def disjunction(self,cubes):
                  out=0
                  for c in cubes:
                      out=self.union(out,self.cube(c))
                  return out
              def minimal(self,root,operation):
                  if root==0:return None
                  memo={}
                  def cost(idx,val):
                      d=self.dims[idx]
                      return ((val!=s.MISSING) if d[0]!='ns' else 0, val!=s.MISSING, val==s.OTHER, str(val))
                  def solve(root):
                      if root==1:return (0,())
                      if root==0:return (float('inf'),())
                      if root in memo:return memo[root]
                      i,children=self.nodes[root]
                      choices=[]
                      for j,ch in enumerate(children):
                          sub,trail=solve(ch)
                          if sub==float('inf'):continue
                          choices.append((sub+cost(i,self.dom[i][j])[0],(i,j)+trail))
                      # missing variable gaps are cost-zero by MISSING (namespace: fixed only)
                      out=min(choices,key=lambda x:(x[0],x[1]))
                      memo[root]=out;return out
                  count,path=solve(root)
                  selected={self.dims[i]:self.dom[i][j] for i,j in zip(path[::2],path[1::2])}
                  out={}
                  for i,d in enumerate(self.dims):
                      if d not in selected:
                          selected[d]=s.MISSING if s.MISSING in self.dom[i] else self.dom[i][0]
                  for kind in ['ns','new','old']:
                      out[kind]={key:val for (k,key),val in selected.items() if k==kind and val!=s.MISSING}
                  return {'namespace_labels':out['ns'],'new_labels':out['new'],'old_labels':out['old'] if operation=='UPDATE' else None,'minimal_present_labels':count}
              def stats(self):return {'created_nodes':len(self.nodes)-2,'apply_cache_entries':len(self.apply_cache),'apply_calls':self.apply_calls,'symbolic_state_space':self.sym.stats.state_space}
          
          
          def check(policy,hooks,namespace='ordersafe-gate',max_nodes=300000):
              spec=policy.get('spec',{});matcher=spec.get('matchConstraints') or {}
              s.has_unsupported_conditions(spec)
              s.validate_match(matcher)
              apis=s.tuples(matcher.get('resourceRules'))
              candidates=s.attached(policy,hooks)
              for w in candidates:s.has_unsupported_conditions(w);s.tuples(w.get('rules'))
              sels=[('ns',matcher.get('namespaceSelector')),('new',matcher.get('objectSelector'))]
              for w in candidates: sels.extend([('ns',w.get('namespaceSelector')),('new',w.get('objectSelector'))])
              if any(api[-1]=='UPDATE' for api in apis):
                  sels.extend([('old',matcher.get('objectSelector'))]+[('old',w.get('objectSelector')) for w in candidates])
              t0=time.perf_counter()
              maxnodes=0
              for api in apis:
                  sym=s.Symbolic(sels,api[-1],namespace)
                  dd=MDD(sym,max_nodes=max_nodes)
                  intent=dd.disjunction(sym.dnf(matcher.get('namespaceSelector'),matcher.get('objectSelector')))
                  matched=[]
                  for w in candidates:
                      if s.api_maybe_match(w,api): matched.extend(sym.dnf(w.get('namespaceSelector'),w.get('objectSelector')))
                  cover=dd.disjunction(matched)
                  gap=dd.intersection(intent,dd.negate(cover))
                  stats=dd.stats();maxnodes=max(maxnodes,stats['created_nodes'])
                  if gap!=0:
                      witness=dd.minimal(gap,api[-1]);ns=witness['namespace_labels'];new=witness['new_labels'];old=witness['old_labels']
                      assert s.truth(matcher.get('namespaceSelector'),ns) and (s.truth(matcher.get('objectSelector'),new) or (old is not None and s.truth(matcher.get('objectSelector'),old)))
                      for w in candidates:
                          if not s.api_maybe_match(w,api):continue
                          assert not (s.truth(w.get('namespaceSelector'),ns) and (s.truth(w.get('objectSelector'),new) or (old is not None and s.truth(w.get('objectSelector'),old))))
                      return {'status':'UNREACHABLE_PREFILTER','api':api,'witness':witness,'runtime_ms':round((time.perf_counter()-t0)*1000,4),'stats':stats}
              return {'status':'COVERED_IN_SUPPORTED_MODEL','runtime_ms':round((time.perf_counter()-t0)*1000,4),'stats':stats}
          
          
          def delta(policy,before,after,namespace='ordersafe-gate'):
              spec=policy.get('spec',{});match=spec.get('matchConstraints') or {}
              s.has_unsupported_conditions(spec)
              s.validate_match(match)
              apis=s.tuples(match['resourceRules']);bef=s.attached(policy,before);aft=s.attached(policy,after)
              for w in bef+aft:s.has_unsupported_conditions(w);s.tuples(w['rules'])
              sels=[('ns',match.get('namespaceSelector')),('new',match.get('objectSelector'))]
              for w in bef+aft: sels.extend([('ns',w.get('namespaceSelector')),('new',w.get('objectSelector'))])
              if any(api[-1]=='UPDATE' for api in apis):sels.extend([('old',match.get('objectSelector'))]+[('old',w.get('objectSelector')) for w in bef+aft])
              for api in apis:
                  sym=s.Symbolic(sels,api[-1],namespace);d=MDD(sym)
                  intent=d.disjunction(sym.dnf(match.get('namespaceSelector'),match.get('objectSelector')))
                  prev=d.disjunction([cube for w in bef if s.api_maybe_match(w,api) for cube in sym.dnf(w.get('namespaceSelector'),w.get('objectSelector'))])
                  next_=d.disjunction([cube for w in aft if s.api_maybe_match(w,api) for cube in sym.dnf(w.get('namespaceSelector'),w.get('objectSelector'))])
                  gap=d.intersection(d.intersection(intent,prev),d.negate(next_))
                  if gap!=0:
                      w=d.minimal(gap,api[-1]);return {'status':'REGRESSION_WITNESS','api':api,'witness':w,'stats':d.stats()}
              return {'status':'NO_REGRESSION_IN_SUPPORTED_MODEL','stats':d.stats()}
          
          
          def main():
              import causal_delta as cd
              import random
              rng=random.Random(20261027)
              n=0
              for op in ['CREATE','UPDATE']:
                  for _ in range(500):
                      selectors=[]
                      def sel():
                          arr=[]
                          for _ in range(rng.randint(0,3)):
                              kind=rng.choice(['In','NotIn','Exists','DoesNotExist'])
                              arr.append({'key':rng.choice(['x','y','z']),'operator':kind,'values':[rng.choice(['v','w'])] if kind in ('In','NotIn') else []})
                          return {'matchExpressions':arr}
                      p=s.p('A','configmaps',op,sel(),sel())
                      hooks=[s.h(['A'],'configmaps',op,sel(),sel()) for _ in range(rng.randint(0,4))]
                      src=check(p,hooks)['status']
                      ref=s.small_brute(p,hooks)
                      if (src=='UNREACHABLE_PREFILTER')!=ref:raise AssertionError(('mismatch',op,src,ref,p,hooks))
                      n+=1
              g1=cd.get_evidence('/mnt/data/OrderSafe_EngineGate_Results(1).zip')
              g2=cd.get_evidence('/mnt/data/OrderSafe_Gate02_Combined_Results.zip')
              assert delta(g1['A-alone']['policies'][0],g1['A-alone']['hooks'],g1['paired']['hooks'])['status']=='REGRESSION_WITNESS'
              assert delta(g1['A-alone']['policies'][0],g1['A-alone']['hooks'],g1['guarded']['hooks'])['status']=='NO_REGRESSION_IN_SUPPORTED_MODEL'
              assert delta(g2['A-alone']['policies'][0],g2['A-alone']['hooks'],g2['paired']['hooks'])['status']=='NO_REGRESSION_IN_SUPPORTED_MODEL'
              print('BDD TEST PASS',n)
          
          if __name__=='__main__':main()
          PY_BDD_EXACT_PY
