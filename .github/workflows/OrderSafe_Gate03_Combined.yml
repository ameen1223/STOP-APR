      - name: Build one consolidated archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,zipfile,glob,os,pathlib
          root=pathlib.Path('all-evidence')
          statuses={}
          for fold in sorted(root.iterdir()) if root.exists() else []:
              if not fold.is_dir(): continue
              def j(name):
                  p=fold/name
                  if not p.exists():return None
                  try:return json.loads(p.read_text())
                  except Exception as e:return {'parse_error':str(e)}
              statuses[fold.name]={
                  'engine':j('summary.json'),'probe':j('probe-results.json'),
                  'causal':j('causal-algorithm-analysis.json'),
                  'old_new':j('old-new-results.json'),
                  'static_tests':(j('static-pilot.json') or {}).get('tests')}
          versions=list(statuses)
          agreement=all((v.get('causal') or {}).get('model_runtime_agreement')=='AGREE' for v in statuses.values())
          body={'matched_versions':versions,'by_version':statuses,
                'same_fixtures':True,'matching_success':agreement and len(versions)==2,
                'novelty_gate':'NOT_ESTABLISHED',
                'limitations':['known defect may be fixed','RBAC readiness must be checked',
                               'MDD is a standard representation; 8.5 novelty unproven',
                               'nontrivial CEL, backend errors and mutation order are out of scope']}
          pathlib.Path('Gate03_Combined_Summary.json').write_text(json.dumps(body,indent=2))
          with zipfile.ZipFile('OrderSafe_Gate03_Combined_Results.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              z.write('Gate03_Combined_Summary.json')
              for file in sorted(root.rglob('*')):
                  if file.is_file():z.write(file)
          print('Combined summary:',body['matching_success'],versions)
          PY
      - name: Upload single result ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrderSafe_Gate03_Combined_Results
          path: OrderSafe_Gate03_Combined_Results.zip
          if-no-files-found: error
          retention-days: 14
