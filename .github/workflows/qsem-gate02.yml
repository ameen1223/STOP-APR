      - name: Independently assess certificates on real monitoring observations
        shell: bash
        run: |
          set -eu
          cat > qsem_real_latency.py <<'QSEM_REAL_LATENCY_02'
          #!/usr/bin/env python3
          """Independent numeric certificate check against actual monitoring observations.
          
          Source: Stefan Sepin's edge-fault-dataset (TU Wien, 2026), CC BY-SA 4.0.
          Read-only external CSV; no re-release of original CSV in result artifact.
          These are 1-second scrape observations, NOT an actual dual-OTel migration pair.
          Two bucket schemes are deliberately constructed stress-test layouts, not claimed
          instrumentation defaults. The certificate is for true nearest-rank quantiles only.
          """
          from __future__ import annotations
          import argparse
          import collections
          import csv
          import hashlib
          import io
          import json
          import math
          import re
          import subprocess
          from pathlib import Path
          import urllib.request
          from qsem_core import histogram_alert_certificate
          
          DEFAULT_URL='https://raw.githubusercontent.com/ssepin/edge-fault-dataset/main/edge_fault_dataset.csv'
          EDGES={
              'layout_a_constructed': [.05,.1,.25,.5,1.0,2.0,5.0],
              'layout_b_constructed': [.075,.15,.3,.6,1.2,2.4,4.8],
          }
          THRESHOLDS=[.1,.25,.5,1.0,2.0]
          PHIS=[.9,.95,.99]
          
          
          def run(out:Path, csv_path:Path|None=None, source_url=DEFAULT_URL, min_rows=1000, min_groups=2):
              out.mkdir(exist_ok=True,parents=True)
              source_commit=None
              if csv_path:
                  raw=csv_path.read_bytes();source=str(csv_path)
              else:
                  remote='https://github.com/ssepin/edge-fault-dataset.git'
                  listing=subprocess.check_output(['git','ls-remote',remote,'refs/heads/main'],timeout=35,text=True).strip()
                  source_commit=listing.split()[0] if listing else None
                  if not source_commit or not re.fullmatch(r'[0-9a-f]{40}',source_commit):
                      raise ValueError('cannot freeze external source commit')
                  source_url=f'https://raw.githubusercontent.com/ssepin/edge-fault-dataset/{source_commit}/edge_fault_dataset.csv'
                  req=urllib.request.Request(source_url,headers={'User-Agent':'QSEM-independent-metrics-audit','Accept':'text/csv'})
                  with urllib.request.urlopen(req,timeout=50) as resp:
                      raw=resp.read(12_000_000)
                  if not 100_000<len(raw)<12_000_000:
                      raise ValueError('unexpected downloaded CSV size')
                  source=source_url
              text=raw.decode('utf-8-sig',errors='strict')
              reader=csv.DictReader(io.StringIO(text))
              required={'response_time','application','device','fault_type'}
              if not reader.fieldnames or not required.issubset(reader.fieldnames):
                  raise ValueError('unexpected CSV schema '+repr(reader.fieldnames))
              groups=collections.defaultdict(list); inspected=0;filtered=0
              for r in reader:
                  inspected+=1
                  if 'curl_exit_code' in r and str(r['curl_exit_code']).strip() not in ('0','0.0'):
                      filtered+=1;continue
                  try:v=float(r['response_time'])
                  except (TypeError,ValueError):filtered+=1;continue
                  if not math.isfinite(v) or v<0:filtered+=1;continue
                  key=tuple((r.get(x) or '<NA>').strip() for x in ('application','device','fault_type'))
                  groups[key].append(v)
              groups={k:values for k,values in groups.items() if len(values)>=30}
              usable=sum(map(len,groups.values()))
              if usable<min_rows or len(groups)<min_groups:
                  raise ValueError(f'data sufficiency not met: usable={usable},groups={len(groups)}')
              checks=0;certified=0;ambiguous=0;false_certificates=0;case_results=[]
              stats=collections.Counter();by_mode=collections.defaultdict(collections.Counter)
              for key,values in sorted(groups.items()):
                  observed=sorted(values)
                  n=len(observed)
                  for scheme_name,edges in EDGES.items():
                      cum=[sum(v<=e for v in observed) for e in edges]
                      for phi in PHIS:
                          kth=observed[math.ceil(phi*n)-1]
                          threshold_groups=[('fixed_prespecified',THRESHOLDS),
                                            ('adaptive_stress_only',[0.8*kth,kth,1.2*kth])]
                          for mode_name,threshold_list in threshold_groups:
                            for threshold in threshold_list:
                              truth=(kth>threshold)
                              cert=histogram_alert_certificate(edges,cum,n,phi,threshold)
                              predicted={'GUARANTEED_FIRING':True,'GUARANTEED_NOT_FIRING':False}.get(cert['status'])
                              wrong=predicted is not None and predicted!=truth
                              false_certificates+=int(wrong)
                              certified+=int(predicted is not None)
                              ambiguous+=int(predicted is None)
                              checks+=1;stats[cert['status']]+=1
