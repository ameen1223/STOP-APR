name: QSEM Gate02 Integrity and Alert Certificates
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialize frozen Gate01 corpus and hardened analyzer
        shell: bash
        run: |
          set -eu
          mkdir -p QSEM_Gate02_Results
          cat > qsem_core.py <<'QSEM_CORE_02'
          #!/usr/bin/env python3
          """Q-SEM Gate02, conservative migration / histogram decision certificate pilot.
          
          Scope: a fail-closed subset of PromQL, HTTP *_count and rate/increase(*_sum),
          modelled under exporter equivalence / exclusive emission. This is NOT a
          complete PromQL implementation and is NOT a general semantic guarantee.
          Original Gate01 and its evidence are unmodified.
          """
          from __future__ import annotations
          import bisect
          import collections
          from dataclasses import dataclass
          import json
          import math
          import random
          import re
          import sys
          from pathlib import Path
          
          OLD = 'http_server_duration_milliseconds_'
          NEW = 'http_server_request_duration_seconds_'
          OLDCLIENT = 'http_client_duration_milliseconds_'
          NEWCLIENT = 'http_client_request_duration_seconds_'
          KNOWN = {'CONNECT', 'DELETE', 'GET', 'HEAD', 'OPTIONS', 'PATCH', 'POST', 'PUT', 'TRACE'}
          UNIVERSE = sorted(KNOWN | {'BREW', 'PROPFIND', 'CUSTOM', '_OTHER'})
          MAPPING = {'http_status_code': 'http_response_status_code', 'http_method': 'http_request_method'}
          SENSITIVE = {'http_scheme', 'net_host_name', 'net_host_port', 'net_peer_name', 'net_peer_port'}
          ALLOWED_FUNCTIONS = {'rate', 'increase', 'max_over_time', 'min_over_time', 'sum', 'avg', 'min', 'max', 'count', 'clamp_min', 'clamp_max'}
          COUNTER_NAMES = {OLD+'count', OLDCLIENT+'count'}
          SUM_NAMES = {OLD+'sum', OLDCLIENT+'sum'}
          BUCKET_NAMES = {OLD+'bucket', OLDCLIENT+'bucket'}
          NEW_NAMES = {NEW+'count', NEW+'sum', NEW+'bucket', NEWCLIENT+'count', NEWCLIENT+'sum', NEWCLIENT+'bucket'}
          METRIC_NAMES = COUNTER_NAMES | SUM_NAMES | BUCKET_NAMES
          IDENT = re.compile(r'[a-zA-Z_:][a-zA-Z_0-9:]*')
          NUMBER = re.compile(r'(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?')
          
          @dataclass(frozen=True)
          class Token:
              kind: str
              text: str
              start: int
              end: int
          
          class Refuse(Exception):
              def __init__(self, decision, reason, detail=None):
                  self.decision, self.reason, self.detail = decision, reason, detail
                  super().__init__(reason)
          
          
          def lex(src: str) -> list[Token]:
              """PromQL token boundaries, NOT a replacement for a full grammar parser."""
              out = []; i = 0
              while i < len(src):
                  c = src[i]; a = i
                  if c.isspace():
                      i += 1
                      continue
                  if c == '#':
                      e = src.find('\n',i)
                      i = len(src) if e == -1 else e
                      continue
                  if c in ('"', "'", '`'):
                      q = c; i+=1; escaped=False
                      while i < len(src):
                          x = src[i]
                          if q != '`' and x == '\\' and not escaped:
                              escaped=True;i+=1;continue
                          if x == q and not escaped:
                              i+=1;break
                          escaped=False;i+=1
                      else:
                          raise Refuse('UNSUPPORTED','UNTERMINATED_STRING')
                      out.append(Token('string',src[a:i],a,i)); continue
                  if src.startswith('$__rate_interval', i):
                      i += len('$__rate_interval')
                      out.append(Token('macro',src[a:i],a,i)); continue
                  m = IDENT.match(src,i)
                  if m:
                      i=m.end();out.append(Token('ident',m.group(),a,i));continue
                  m = NUMBER.match(src,i)
                  if m:
                      i=m.end();out.append(Token('number',m.group(),a,i));continue
                  if i+1 < len(src) and src[i:i+2] in ('=~','!~','!=','==','>=','<='):
                      i+=2;out.append(Token('op',src[a:i],a,i));continue
                  if c in '{}[](),.:+-*/%^><=!@':
                      i+=1;out.append(Token('punct',c,a,i));continue
                  raise Refuse('UNSUPPORTED','UNRECOGNIZED_TOKEN:'+repr(c))
              return out
          
          
          def pairs(toks: list[Token]) -> dict[int,int]:
              match={')':'(',']':'[','}':'{'};stack=[];where={}
              for i,t in enumerate(toks):
                  if t.text in ('(','[','{') and t.kind!='string': stack.append((t.text,i))
                  if t.text in (')',']','}') and t.kind!='string':
                      if not stack or stack[-1][0]!=match[t.text]:
                          raise Refuse('UNSUPPORTED','INVALID_BRACKET_STRUCTURE')
                      _,j=stack.pop();where[i]=j;where[j]=i
              if stack:raise Refuse('UNSUPPORTED','INVALID_BRACKET_STRUCTURE')
              return where
          
          
          def _quoted_raw(q: str) -> str:
              if len(q)<2 or q[0] not in ('"',"'",'`') or q[-1]!=q[0]:
                  raise Refuse('UNSUPPORTED','UNEXPECTED_MATCHER_LITERAL')
              # RE2/Python regex equivalence is NOT assumed; callers restrict to safe literals.
              return q[1:-1]
          
          
          def method_map(x):return x if x in KNOWN else '_OTHER'
          
          
          def fibre_witness(op: str, text: str):
              """Finite-domain witness, explicitly not a proof over all HTTP method strings."""
              if op in ('=~','!~') and not re.fullmatch(r'[A-Z_]+(?:\|[A-Z_]+)*',text):
                  raise Refuse('UNSUPPORTED','REGEX_OUTSIDE_PROVEN_SUBSET')
              try:
                  def p(x):
                      eq = (x==text) if op in ('=','!=') else bool(re.fullmatch(text,x))
                      return eq if op in ('=','=~') else not eq
                  fibres=collections.defaultdict(list)
                  for x in UNIVERSE:fibres[method_map(x)].append(x)
                  for vs in fibres.values():
                      for a in vs:
                          for b in vs:
                              if p(a)!=p(b):
                                  return {'old_a':a,'old_b':b,'new_a':method_map(a),'new_b':method_map(b),
                                          'predicate_a':p(a),'predicate_b':p(b),'scope':'finite_method_universe'}
              except re.error as exc:
                  raise Refuse('UNSUPPORTED','INVALID_METHOD_REGEX') from exc
              return None
          
          
          def _metric_rename(name):
              if name.startswith(OLD):return NEW+name[len(OLD):]
              if name.startswith(OLDCLIENT):return NEWCLIENT+name[len(OLDCLIENT):]
              raise Refuse('UNSUPPORTED','UNRECOGNIZED_METRIC')
          
          
          def migrate(query: str, mode: str='exclusive') -> dict:
              """No code may rewrite a string literal or a label *value*.
          
              The optional external PromQL parser validates complete syntax separately;
              this scanner only authorizes a deliberately small family of rewrite edits.
              """
              edits=[]
              try:
                  ts=lex(query); matching=pairs(ts)
                  texts=[t.text for t in ts]
                  if any(t.text in ('@','offset') and t.kind!='string' for t in ts):
                      raise Refuse('UNSUPPORTED','TEMPORAL_MODIFIER_OUTSIDE_SCOPE')
                  for i,t in enumerate(ts):
                      if t.kind=='ident' and i+1<len(ts) and ts[i+1].text=='(':
                          if t.text not in ALLOWED_FUNCTIONS and t.text not in ('histogram_quantile','by','without'):
                              raise Refuse('UNSUPPORTED','FUNCTION_OUTSIDE_SCOPE:'+t.text)
                  if any(t.kind=='ident' and t.text in ('on','ignoring','group_left','group_right','unless','and','or','bool') for t in ts):
                      raise Refuse('UNSUPPORTED','VECTOR_MATCHING_OUTSIDE_SCOPE')
                  if mode!='exclusive':
                      raise Refuse('PROVENANCE_REQUIRED','DUPLICATED_OR_MIXED_SOURCE_UNPARTITIONED')
                  # Partition curly braces into matcher selector contexts, capturing only key tokens.
                  labels={}; grouping={}; metric_positions=set(); all_metric_strings=[]
                  for i,t in enumerate(ts):
                      if t.kind=='ident' and t.text in METRIC_NAMES | NEW_NAMES:
                          all_metric_strings.append((i,t.text))
                      if t.text=='{' and t.kind!='string':
                          if i==0 or ts[i-1].kind!='ident' or ts[i-1].text not in METRIC_NAMES | NEW_NAMES:
                              raise Refuse('UNSUPPORTED','OTHER_METRIC_OR_UNSCOPED_MATCHER')
                          j=matching[i]; n=i+1
                          while n<j:
                              if ts[n].text==',':n+=1;continue
                              if n+2>=j or ts[n].kind!='ident' or ts[n+1].text not in ('=', '!=','=~','!~') or ts[n+2].kind!='string':
                                  raise Refuse('UNSUPPORTED','COMPLEX_OR_INVALID_LABEL_SELECTOR')
                              labels[n]=(ts[n+1].text,_quoted_raw(ts[n+2].text))
                              n+=3
                              if n<j and ts[n].text!=',':
                                  raise Refuse('UNSUPPORTED','MALFORMED_MATCHER_SEPARATOR')
                      if t.kind=='ident' and t.text in ('by','without') and i+1<len(ts) and ts[i+1].text=='(':
                          j=matching[i+1]
                          for k in range(i+2,j):
                              if ts[k].text==',':continue
                              if ts[k].kind!='ident':raise Refuse('UNSUPPORTED','BAD_GROUPING')
                              grouping[k]=t.text
                  old_found=[(i,n) for i,n in all_metric_strings if n in METRIC_NAMES and i not in labels and i not in grouping]
                  new_found=[(i,n) for i,n in all_metric_strings if n in NEW_NAMES and i not in labels and i not in grouping]
                  if not old_found:
                      return {'decision':'ALREADY_NEW' if new_found else 'UNSUPPORTED','reasons':['NO_LEGACY_METRIC'],'rewrite':None}
                  if new_found:raise Refuse('PROVENANCE_REQUIRED','OLD_AND_NEW_REFERENCED')
                  if any(n in BUCKET_NAMES for _,n in old_found):
                      raise Refuse('REJECT_BUCKET_LAYOUT','BUCKET_VECTOR_LAYOUT_NOT_VERIFIED')
                  if any(t.kind=='ident' and t.text=='histogram_quantile' for t in ts):
                      raise Refuse('REJECT_BUCKET_LAYOUT','PERCENTILE_REQUIRES_BUCKET_EQUIVALENCE_PROOF')
                  # All old metric identifier positions must be at valid selector locations.
                  for i,n in old_found:
                      if i>0 and ts[i-1].text in ('.',):
                          raise Refuse('UNSUPPORTED','INVALID_METRIC_CONTEXT')
                      if i+1<len(ts) and ts[i+1].text not in ('{','[',')',',','/','*','+','-','==','!=','>','<','>=','<='):
                          raise Refuse('UNSUPPORTED','AMBIGUOUS_METRIC_CONTEXT')
                      if i in labels or i in grouping:
                          raise Refuse('UNSUPPORTED','METRIC_MISCLASSIFIED_AS_LABEL')
                  # Reject other series even when their names do not appear in matcher braces.
                  # This prevents accidentally renaming a shared label on an unrelated metric.
                  for i,t in enumerate(ts):
                      if t.kind=='ident' and t.text in ('rate','increase','max_over_time','min_over_time') and i+2<len(ts) and ts[i+1].text=='(': 
                          if ts[i+2].kind!='ident' or ts[i+2].text not in METRIC_NAMES | NEW_NAMES:
                              raise Refuse('UNSUPPORTED','OTHER_METRIC_IN_TEMPORAL_QUERY')
                  # Need a clear window of temporal operators to reason about counters.
                  if not any(t.kind=='ident' and t.text in ('rate','increase','max_over_time','min_over_time') for t in ts):
                      raise Refuse('UNSUPPORTED','TEMPORAL_SEMANTICS_NOT_VALIDATED')
                  # Grouping by HTTP method cannot retain fine-grained distinctions after collapse.
                  if any(ts[i].text=='http_method' for i in grouping):
                      raise Refuse('PROVEN_IMPOSSIBLE','GROUP_LABEL_COLLAPSE',
                                    {'witness':{'old_a':'BREW','old_b':'PROPFIND','new_a':'_OTHER','new_b':'_OTHER'}})
                  if any(ts[i].text in SENSITIVE for i in list(labels)+list(grouping)):
                      raise Refuse('NEEDS_SEMANTIC_REVIEW','FIELD_SEMANTICS_OR_EMISSION_CHANGED')
                  for i,(op,pattern) in labels.items():
                      if ts[i].text=='http_method':
                          w=fibre_witness(op,pattern)
                          if w:raise Refuse('PROVEN_IMPOSSIBLE','METHOD_VALUE_COLLAPSE',{'witness':w})
                  # Only known legacy metric identifiers and *label-key positions* may be edited.
                  for i,n in old_found: edits.append((ts[i].start,ts[i].end,_metric_rename(n)))
                  for i in list(labels)+list(grouping):
                      if ts[i].text in MAPPING:
                          edits.append((ts[i].start,ts[i].end,MAPPING[ts[i].text]))
                  # All legacy _sum references must be immediately inside rate()/increase()
                  # of a vector selector. Insert an explicit factor to preserve old ms units.
                  n_scaled=0; covered_sum=set()
                  for i,t in enumerate(ts):
                      if t.kind!='ident' or t.text not in ('rate','increase') or i+1>=len(ts) or ts[i+1].text!='(':
                          continue
                      k=matching[i+1]
                      sums=[j for j,n in old_found if n in SUM_NAMES and i+2<=j<k]
                      if not sums:continue
                      if len(sums)!=1 or ts[i+2].text not in SUM_NAMES or any(ts[x].text=='(' for x in range(i+2,k)):
                          raise Refuse('UNSUPPORTED','COMPLEX_SUM_RATE_CONTEXT')
                      j=sums[0]
                      if j != i+2:raise Refuse('UNSUPPORTED','SUM_NOT_DIRECT_RATE_ARGUMENT')
                      # Strict matrix selector: metric{matchers}?[range] inside rate/increase.
                      after=j+1
                      if after<k and ts[after].text=='{':after=matching[after]+1
                      if after>=k or ts[after].text!='[' or matching[after]!=k-1:
                          raise Refuse('UNSUPPORTED','SUM_WITHOUT_DIRECT_RANGE')
                      edits.extend(((t.start,t.start,'(1000 * '),(ts[k].end,ts[k].end,')')))
                      covered_sum.add(j);n_scaled+=1
                  if any(j not in covered_sum for j,n in old_found if n in SUM_NAMES):
                      raise Refuse('UNSUPPORTED','SUM_NOT_SCALED_SAFELY')
                  # Unknown legacy symbols in label-key positions are not automatically renamed.
                  if any(ts[i].text in SENSITIVE for i in labels):
                      raise Refuse('NEEDS_SEMANTIC_REVIEW','FIELD_SEMANTICS_OR_EMISSION_CHANGED')
                  # Verify edits are non-overlapping and no quote is targeted.
                  for a,b,repl in edits:
                      if any(not (b <= q.start or a >= q.end) for q in ts if q.kind=='string'):
                          raise AssertionError('attempted to edit literal')
                  for a,b,_ in sorted(edits):
                      if a > b:raise AssertionError('negative span')
                  edit_positions = set()
                  for a,b,_ in edits:
                      for z in range(a,b):
                          if z in edit_positions:raise AssertionError('overlapping edit spans')
                          edit_positions.add(z)
                  result=query
                  for a,b,repl in sorted(edits,key=lambda v:(v[0],v[1]),reverse=True):
                      result=result[:a]+repl+result[b:]
                  return {'decision':'CONDITIONAL_REWRITE',
                          'reasons':['REQUIRES_EXPORTER_EQUIVALENCE','REQUIRES_EXCLUSIVE_EMISSION','REQUIRES_SAME_EVENTS_AND_LABEL_COMPLETENESS',
                                     'METHOD_VALUE_FINITE_DOMAIN_ONLY'],
                          'rewrite':result,'sum_rates_scaled':n_scaled,
                          'edits':len(edits)}
              except Refuse as exc:
                  ret={'decision':exc.decision,'reasons':[exc.reason],'rewrite':None}
                  if exc.detail:ret['detail']=exc.detail
                  return ret
          
          
          def histogram_alert_certificate(edges, cumulative, total, phi, threshold):
              """Sharp determination of TRUE nearest-rank quantile exceeding a threshold.
              Does NOT assert equivalence to PromQL histogram_quantile interpolation.
              Edges/cumulative are finite exact counts of samples up to each edge.
              """
              if not len(edges)==len(cumulative) or not edges or any(not math.isfinite(x) for x in edges):
                  raise ValueError('bad edges')
              if any(edges[i]>=edges[i+1] for i in range(len(edges)-1)):
                  raise ValueError('edges must increase')
              if total<1 or int(total)!=total or any(int(x)!=x or x<0 for x in cumulative):
                  raise ValueError('require positive integer count data')
              if any(cumulative[i]>cumulative[i+1] for i in range(len(cumulative)-1)) or cumulative[-1]>total:
                  raise ValueError('nonmonotone cumulative counts')
              if not (0<phi<=1) or not math.isfinite(threshold):raise ValueError('invalid phi or threshold')
              j=bisect.bisect_left(edges,threshold)
              if j<len(edges) and edges[j]==threshold: lower=upper=cumulative[j]
              else:
                  lower=cumulative[j-1] if j else 0
                  upper=cumulative[j] if j<len(edges) else total
              rank=math.ceil(phi*total)
              if upper<rank: status='GUARANTEED_FIRING'
              elif lower>=rank: status='GUARANTEED_NOT_FIRING'
              else:status='AMBIGUOUS'
              return {'status':status,'min_events_le_threshold':lower,'max_events_le_threshold':upper,
                      'rank':rank,'threshold':threshold,'scope':'true_nearest_rank_quantile_not_promql_interpolation',
                      'counterexample_counts':{'world_low_le':lower,'world_high_le':upper} if status=='AMBIGUOUS' else None}
          
          
          def evaluate_previous_corpus(path: Path) -> list[dict]:
              original=json.loads(path.read_text(encoding='utf8'))
              return [{'name':o['name'],'origin':o['origin'],'query':o['query'],'old_decision':o['result']['decision'],
                       'new':migrate(o['query'])} for o in original]
          
          
          def run_tests() -> dict:
              good={};detail={}
              audit_inputs=[
                  ('team="http_method"','team="http_method"'),
                  ('team="http_status_code"','team="http_status_code"'),
                  ('team="http_server_duration_milliseconds_count"','team="http_server_duration_milliseconds_count"'),
              ]
              base='sum(rate('+OLD+'count{team="http_method",http_status_code="200"}[5m]))'
              r=migrate(base)
              good['original_literal_preserved']=(r['decision']=='CONDITIONAL_REWRITE' and 'team="http_method"' in r['rewrite'])
              good['key_converted']=(r['decision']=='CONDITIONAL_REWRITE' and 'http_response_status_code="200"' in r['rewrite'])
              for a,b in audit_inputs:
                  q='sum(rate('+OLD+'count{'+a+'}[5m]))';got=migrate(q)
                  good['regression_'+a]=(got['decision']=='CONDITIONAL_REWRITE' and b in got['rewrite'])
              q='sum(rate('+OLD+'sum[5m])) / sum(rate('+OLD+'count[5m]))'
              got=migrate(q)
              good['sum_ms_factor']=(got['decision']=='CONDITIONAL_REWRITE' and got['sum_rates_scaled']==1 and '(1000 * rate('+NEW+'sum[5m]))' in got['rewrite'])
              q='sum(increase('+OLDCLIENT+'sum{http_method="GET"}[10m]))'
              got=migrate(q)
              good['client_increase']=(got['decision']=='CONDITIONAL_REWRITE' and got['sum_rates_scaled']==1 and NEWCLIENT+'sum' in got['rewrite'])
              q='sum(rate('+OLD+'count{http_method="PROPFIND"}[5m]))'
              good['lossy_method_refused']=migrate(q)['decision']=='PROVEN_IMPOSSIBLE'
              q='sum by(http_method)(rate('+OLD+'count[5m]))'
              good['lossy_grouping_refused']=migrate(q)['decision']=='PROVEN_IMPOSSIBLE'
              q='histogram_quantile(0.95,sum by(le)(rate('+OLD+'bucket[5m])))'
              good['buckets_refused']=migrate(q)['decision']=='REJECT_BUCKET_LAYOUT'
              good['mixed_refused']=migrate('sum(rate('+OLD+'count[5m]))+sum(rate('+NEW+'count[5m]))')['decision']=='PROVENANCE_REQUIRED'
              good['unsupported_binary_refused']=migrate('sum(rate('+OLD+'count[5m])) on(job) foo')['decision']=='UNSUPPORTED'
              good['unbalanced_refused']=migrate('sum(rate('+OLD+'count[5m])')['decision']=='UNSUPPORTED'
              good['no_string_as_metric']=migrate('sum(rate(other_counter{team="'+OLD+'count"}[5m]))')['decision']=='UNSUPPORTED'
              good['other_metric_guard']=migrate('sum(rate('+OLD+'count[5m]))+sum(rate(unrelated_metric{http_status_code="200"}[5m]))')['decision']=='UNSUPPORTED'
              good['other_metric_no_labels_guard']=migrate('sum(rate('+OLD+'count[5m]))+sum(rate(unrelated_metric[5m]))')['decision']=='UNSUPPORTED'
              good['hist_true_quantile_high']=histogram_alert_certificate([.2,.6],[1,5],10,.9,.2)['status']=='GUARANTEED_FIRING'
              good['hist_true_quantile_low']=histogram_alert_certificate([.2,.6],[8,10],10,.9,.6)['status']=='GUARANTEED_NOT_FIRING'
              good['hist_ambiguous']=histogram_alert_certificate([.2,.8],[2,8],10,.5,.5)['status']=='AMBIGUOUS'
              good['hist_exact_edge']=histogram_alert_certificate([.2,.8],[2,8],10,.5,.8)['status']=='GUARANTEED_NOT_FIRING'
              rng=random.Random(719)
              # Adversarial string content fuzz; derived from independent recorded audit bug.
              for i in range(2000):
                  v=''.join(rng.choice('abcdefghijklmnopqrstuvwxyz_0123456789') for _ in range(rng.randint(0,35)))
                  v=v.replace('http_', 'http_')
                  if i%3==0:v+=OLD+'count'
                  if i%7==0:v+='http_method'
                  if i%11==0:v+='http_status_code'
                  v=v.replace('\\','').replace('"','')
                  q='sum(rate('+OLD+'count{team="'+v+'",http_method="GET"}[5m]))'
                  r=migrate(q)
                  if r['decision']!='CONDITIONAL_REWRITE' or 'team="'+v+'"' not in r['rewrite']:
                      good['literal_property_2000']=False;detail['literal_failure']=q;break
              else:good['literal_property_2000']=True
              # Numeric proof-oracle: generate exact individual events and check that
              # 'GUARANTEED' claims match every generated event stream.
              ncheck=0
              for i in range(5000):
                  edges=sorted(set(rng.sample(range(1,900),rng.randint(2,8))))
                  values=[rng.randint(0,1000) for _ in range(rng.randint(2,90))]
                  cum=[sum(x<=e for x in values) for e in edges]
                  phi=rng.choice([.5,.9,.95,.99,1.0]); T=rng.randint(0,1000)
                  cert=histogram_alert_certificate(edges,cum,len(values),phi,T)
                  k=math.ceil(phi*len(values));true=sorted(values)[k-1]>T
                  if (cert['status']=='GUARANTEED_FIRING' and not true) or (cert['status']=='GUARANTEED_NOT_FIRING' and true):
                      good['histogram_sound_5000']=False;detail['hist_failure']={'edges':edges,'counts':cum,'phi':phi,'t':T,'n':len(values)};break
                  ncheck+=1
              else: good['histogram_sound_5000']=True
              return {'assertions':good,'pass':sum(good.values()),'total':len(good),'numeric_oracle_cases':ncheck,
                      'literal_property_cases':2000,'details':detail,'status':'PASS' if all(good.values()) else 'FAIL'}
          
          
          def produce(results:Path, prior_corpus:Path, with_parser: bool=False):
              results.mkdir(parents=True, exist_ok=True)
              d=evaluate_previous_corpus(prior_corpus)
              t=run_tests()
              (results/'decisions_gate02.json').write_text(json.dumps(d,indent=2),encoding='utf8')
              (results/'selftests_gate02.json').write_text(json.dumps(t,indent=2),encoding='utf8')
              external=[r for r in d if r['origin']=='published_expression']
              # For external parse validation, Grafana interpolation macros are placeholders
              # and must be substituted transparently before calling an independent parser.
              ast_result={'status':'NOT_RUN','reason':'independent parser not installed'}
              if with_parser:
                  try:
                      import promql_parser
                      checks=[]
                      for r in d:
                          before=r['query'].replace('$__rate_interval','5m')
                          after=(r['new']['rewrite'] or r['query']).replace('$__rate_interval','5m')
                          try:
                              promql_parser.parse(before)
                              promql_parser.parse(after)
                              literal_equal=([t.text for t in lex(before) if t.kind=='string']==[t.text for t in lex(after) if t.kind=='string'])
                              checks.append({'name':r['name'],'before':'PASS','after':'PASS',
                                             'literals_identical':literal_equal,'status':'PASS' if literal_equal else 'FAIL'})
                          except Exception as exc:
                              checks.append({'name':r['name'],'before':'UNVERIFIED','after':'UNVERIFIED','status':'FAIL', 'error':str(exc)[:300]})
                      ast_result={'status':'PASS' if all(x['status']=='PASS' for x in checks) else 'FAIL',
                                  'note':'Grafana $__rate_interval substituted with 5m; this validates parsing, not equivalence',
                                  'tested':len(checks),'checks':checks}
                  except ImportError:ast_result={'status':'DEPENDENCY_MISSING'}
              (results/'independent_parser.json').write_text(json.dumps(ast_result,indent=2),encoding='utf8')
              summary={'project':'QSEM','gate':'02_harden_and_certificate','baseline_gate01_retained':True,
                       'published_examples':len(external),'decisions_published':dict(collections.Counter(r['new']['decision'] for r in external)),
                       'selftests':t['status'],'passed':t['pass'],'total':t['total'],
                       'literal_bug_fixed':t['assertions']['original_literal_preserved'],
                       'independent_parser':ast_result['status'],'novelty':'NOT_ESTABLISHED',
                       'limitations':['conservative lexer+selector-context rewrite, not full PromQL AST',
                                      'optional third-party PromQL parser validates syntax only',
                                      'source examples curated; no real raw time-series',
                                      'histogram certificate concerns true nearest-rank quantiles, NOT PromQL histogram_quantile interpolation',
                                      'method fibres cover a finite pilot universe only',
                                      'no claims of baseline performance or journal-grade originality']}
