          def decode_problem(h,phi,T):
              ns,lower,base=h.validate();bounds=h.bounds_ms;edges=bounds[1:]
              j=next(i for i,e in enumerate(edges) if T<=e)
              if j==0:
                  weights=[T/F(edges[0])]; indices=[1];nom=weights[0]*h.cumulative[1]
              else:
                  alpha=(T-edges[j-1])/F(edges[j]-edges[j-1]); weights=[1-alpha,alpha]
                  indices=[j,j+1];nom=(1-alpha)*h.cumulative[j]+alpha*h.cumulative[j+1]
