          def exact_milp_opt(costs,caps,weights,budget):
              # Integer-weight objective avoids FP conversion of rational coefficients.
              den=1
              for w in weights:den=lcm(den,w.denominator)
              obj=[int(w*den) for w in weights]
              r=milp(c=[-float(x) for x in obj],integrality=[1]*len(obj),
                     bounds=Bounds([0]*len(obj),caps),
                     constraints=LinearConstraint([costs],-float('inf'),budget),
                     options={'mip_rel_gap':0,'time_limit':15})
              if not r.success:raise AssertionError(('MILP_SOLVER',r.message,costs,caps,budget,obj))
              xy=[int(round(v)) for v in r.x]
              assert all(0<=x<=cap for x,cap in zip(xy,caps))
              assert sum(c*x for c,x in zip(costs,xy))<=budget
              assert abs(sum(a*x for a,x in zip(obj,xy))+r.fun)<1e-5
              return sum(w*x for w,x in zip(weights,xy)),xy
          
          
