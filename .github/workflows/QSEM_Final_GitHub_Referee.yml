          #!/usr/bin/env python3
          """Independent Q-SEM referee tests, NOT a general PromQL/float64 proof.
          
          Validates exact old-summary completeness and minimum 0/1/2 existing NEW bucket
          counter acquisitions. All full-world labels are computed from events with a
          separately written reference quantile; large-case optimization is independently
          checked by SciPy MILP with integer-scaled objective weights.
          """
          from collections import defaultdict, Counter
          from fractions import Fraction as F
          from itertools import combinations_with_replacement, product
          from math import lcm
          from pathlib import Path
          from time import perf_counter
          import json, random
          from scipy.optimize import Bounds, LinearConstraint, milp
          from rounding_certificate import OldHistogram, old_from_ms, certify, target_from_events_ms, _pair_opt
          from active_bucket_certificate import optimal_bucket_probes
          from exact_world_witness import ideal_alert_evidence
          
          OUT=Path('out');OUT.mkdir(exist_ok=True)
          
          
          def quantile_independent(phi, edges, cum, count):
              # Independent fraction-only reference: inverse of the linearly interpolated CDF
              rank=phi*count; low=F(0); prior=0
              for edge, c in zip(edges,cum):
                  if c>=rank:
                      assert c>prior,(edge,c,prior,rank)
                      return low+(F(edge)-low)*(rank-prior)/(c-prior)
                  low=F(edge);prior=c
              return F(edges[-1])
          
          
          def all_worlds():
              bounds=(0,3,6,10)
              hist={}; possibilities=defaultdict(set); enumerated_worlds=0
              # A NEW set of bounds, tie and boundary cases, distinct from Gate06.
              for n in range(1,5):
                  for rounded in combinations_with_replacement(range(12),n):
                      old=old_from_ms(rounded,bounds)
                      k=(old.cumulative,old.count,old.sum_rounded_ms)
                      hist[k]=old
                      alts=[(F(v)-F(1,4),F(v),F(v)+F(1,4)) if v in bounds[1:] else (F(v),) for v in rounded]
                      for vals in product(*alts):
                          assert all(x>=0 for x in vals)
                          cu=tuple(target_from_events_ms(vals,bounds))
                          possibilities[k].add(cu)
                          enumerated_worlds+=1
              phis=(F(1,3),F(1,2),F(3,4),F(9,10),F(19,20))
              thresholds=tuple(F(x,2) for x in range(-2,24))
              checks=Counter(); mistakes=[]; examples=[]
              for key, vectors in possibilities.items():
                  h=hist[key]; n=h.count
                  for phi in phis:
                      qs={c:quantile_independent(phi,bounds[1:],c,n) for c in vectors}
                      for T in thresholds:
                          truths={c:(q>T) for c,q in qs.items()}
                          classes=set(truths.values())
                          expected_status=('CERTIFIED_FIRE' if classes=={True} else
                                           'CERTIFIED_CLEAR' if classes=={False} else 'UNDECIDABLE')
                          pred=certify(h,phi,T)
                          plan=optimal_bucket_probes(h,phi,T)
                          if expected_status=='UNDECIDABLE':
                              j=next(i for i,v in enumerate(bounds[1:]) if T<=v)
                              relevant=(j,) if j==0 else (j-1,j)
                              enough=[]
                              for coordinate in relevant:
                                  groups=defaultdict(set)
                                  for cum,flag in truths.items():groups[cum[coordinate]].add(flag)
                                  if all(len(labels)==1 for labels in groups.values()):
                                      enough.append(bounds[1:][coordinate])
                              expected_min=1 if enough else 2
                              if expected_min==1 and not set(plan.get('sufficient_new_counter_edges_ms',[]))==set(enough):
                                  mistakes.append(('SINGLETON_EDGE',str(key),str(phi),str(T),enough,plan))
                              checks['unknown_count']+=1
                              if len(examples)<8 and expected_min==2:
                                  proof=ideal_alert_evidence(h,phi,T)
                                  if proof['status']!='UNDECIDABLE':
                                      mistakes.append(('WITNESS_MISSING',str(key),str(phi),str(T)))
                                  else:
                                      examples.append({'old_n':n,'phi':str(phi),'T':str(T),
                                                       'witness_no_fire_q':proof['baseline_q'],
                                                       'witness_fire_q':proof['flipping_q']})
                          else:
                              expected_min=0
                          if pred['status']!=expected_status or plan['status']!=expected_status or plan['min_queries']!=expected_min:
                              mistakes.append(('INCORRECT',str(key),str(phi),str(T),expected_status,expected_min,pred,plan))
                              if len(mistakes)>10:break
                          checks['decisions']+=1
                          checks['need_'+str(expected_min)] += 1
                      if len(mistakes)>10:break
                  if len(mistakes)>10:break
              report={'status':'PASS' if not mistakes else 'FAIL', 'new_bounds_ms':bounds,
                      'distinct_old_summaries':len(possibilities),
                      'raw_world_placements':enumerated_worlds,
                      'independent_exact_decision_checks':checks['decisions'],
                      'unknown_cases':checks['unknown_count'],
                      'needed_new_counters':{k:checks[k] for k in ('need_0','need_1','need_2')},
                      'opposite_witness_samples':examples,
                      'errors':mistakes[:3],
                      'limits':'Exact rational classic histogram, integer-ms rounded old observations, static sums; no PromQL rate or float64 theorem'}
              (OUT/'independent_world_oracle.json').write_text(json.dumps(report,indent=2,default=str))
              print('INDEPENDENT_EXACT',report['status'],report['independent_exact_decision_checks'], 'errors',len(mistakes),flush=True)
              if mistakes:raise AssertionError(mistakes[:1])
