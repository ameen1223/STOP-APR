      - name: Independent full worlds, minimum counters, integer objective MILP
        id: referee
        shell: bash
        run: |
          set -euo pipefail
          python referee_audit.py 2>&1 | tee out/referee.log
          test -s out/referee_summary.json
          python - <<'PY'
          import json
          r=json.load(open('out/referee_summary.json'))
          assert r['status']=='PASS',r
          print('INDEPENDENT_REFEREE_PASS')
          PY
      - name: Reproduce precision counterexample with standalone Go kernel
        id: go
        shell: bash
        run: |
          set -euo pipefail
          go version | tee out/go_version.txt
          GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go run prometheus_delta_reproducer.go 2>&1 | tee out/go_precision_kernel.log
          grep -q 'ignored=1' out/go_precision_kernel.log
          grep -q 'FIRE=true' out/go_precision_kernel.log
      - name: Build targeted true-Prometheus precision fixtures
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          python prometheus_fixture.py 2>&1 | tee out/prometheus_fixture.log
          test -s out/promql_referee.yml
          test -s out/prometheus_manifest.json
      - name: Download SHA256-verified Prometheus promtool 3.15.1
        id: download
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            -o prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.15.1/prometheus-3.15.1.linux-amd64.tar.gz 2>&1 | tee out/prometheus_download.log
          echo '6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84  prometheus.tar.gz' | sha256sum -c - | tee out/prometheus_checksum.log
          tar -xzf prometheus.tar.gz prometheus-3.15.1.linux-amd64/promtool
          mv prometheus-3.15.1.linux-amd64/promtool ./promtool
          chmod +x ./promtool
          ./promtool --version | tee out/promtool_version.txt
      - name: Run actual Prometheus high-count small-delta and controls
        id: promql
        shell: bash
        run: |
          set -euo pipefail
          ./promtool test rules out/promql_referee.yml 2>&1 | tee out/prometheus_referee.log
          grep -q 'SUCCESS' out/prometheus_referee.log
      - name: Audit final completeness and scientific limits
        if: always()
        shell: bash
        env:
          QSEM_STAGE_DEPS: ${{ steps.deps.outcome }}
          QSEM_STAGE_RESTORE: ${{ steps.restore.outcome }}
          QSEM_STAGE_REFEREE: ${{ steps.referee.outcome }}
          QSEM_STAGE_GO: ${{ steps.go.outcome }}
          QSEM_STAGE_FIXTURES: ${{ steps.fixtures.outcome }}
          QSEM_STAGE_DOWNLOAD: ${{ steps.download.outcome }}
          QSEM_STAGE_PROMQL: ${{ steps.promql.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          out=Path('out');out.mkdir(exist_ok=True)
          stages={k.removeprefix('QSEM_STAGE_').lower():v for k,v in os.environ.items() if k.startswith('QSEM_STAGE_')}
          needed=['integrity_checks.log','independent_world_oracle.json','independent_milp.json','frozen_otel_crosscheck.json','referee_summary.json','go_precision_kernel.log','promql_referee.yml','prometheus_referee.log']
          missing=[x for x in needed if not (out/x).is_file() or (out/x).stat().st_size==0]
          failed=[k for k,v in stages.items() if v!='success']
          state='PASS' if not missing and not failed else 'INCOMPLETE_OR_FAILED'
          result={
           'status':state,'stage_outcomes':stages,'missing_outputs':missing,'failed_or_skipped_stages':failed,
           'independent_exact_scope':'integer-rounded static classic histogram; exhaustive small worlds',
           'independent_optimizer_scope':'same old count/sum, SciPy MILP; not more decisive than exact ideal oracle',
           'prometheus_scope':'3 targeted static true-Prometheus cases, NOT general PromQL rate/reset or all binary64 corner cases',
           'frozen_otel_scope':'archived 75 localhost paired requests, not independent production paired metrics',
           'minimum_counter_scope':'existing NEW cumulative bucket counters only; not arbitrary new sketches',
           'novelty_above_8_5_proven':False,'paper_acceptance_guaranteed':False,
           'research_decision':'Interpret proof strength and literature separately; CI PASS alone is not originality proof.'}
          (out/'summary.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({'status':state,'stages':stages,'missing':missing,'failed':failed}))
          PY
      - name: Upload complete evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QSEM_Final_GitHub_Referee_Evidence
          path: out/
          if-no-files-found: error
          retention-days: 30
