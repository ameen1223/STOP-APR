          package main
          import (
            "fmt"
            "math"
            "sort"
          )
          type Bucket struct{ UpperBound, Count float64 }
          // Follows the published Prometheus v3.15.1 static BucketQuantile order,
          // including ensureMonotonicAndIgnoreSmallDeltas and IEEE-754 math operations.
          func qFloat(q float64, a []Bucket) (float64,int) {
            b:=append([]Bucket(nil), a...)
            sort.Slice(b,func(i,j int)bool{return b[i].UpperBound<b[j].UpperBound})
            prev:=b[0].Count; ignored:=0
            for i:=1;i<len(b);i++{
              curr:=b[i].Count
              if curr==prev {continue}
              absSum:=math.Abs(prev)+math.Abs(curr)
              diff:=math.Abs(prev-curr)
              if diff/math.Min(absSum,math.MaxFloat64)<1e-12 { b[i].Count=prev; ignored++; continue}
              if curr<prev {b[i].Count=prev;continue}
              prev=curr
            }
            N:=b[len(b)-1].Count
            rank:=q*N
            idx:=sort.Search(len(b)-1,func(i int)bool{return b[i].Count>=rank})
            if idx==len(b)-1{return b[len(b)-2].UpperBound,ignored}
            if idx==0 && b[0].UpperBound<=0{return b[0].UpperBound,ignored}
            start:=0.0;end:=b[idx].UpperBound;count:=b[idx].Count
            if idx>0 {start=b[idx-1].UpperBound;count-=b[idx-1].Count;rank-=b[idx-1].Count}
            return start+(end-start)*(rank/count),ignored
          }
          func main(){
            N:=float64(10000000000000)
            C1:=N/2-1
            b:=[]Bucket{{0.005,C1},{0.010,N/2},{0.025,N/2+100},{0.05,N},{math.Inf(1),N}}
            q,ignored:=qFloat(0.5,b)
            fmt.Printf("N=%.0f, ignored=%d, quantile_ms=%.12f, T_ms=10.05, FIRE=%v\n",N,ignored,q*1000,q>0.01005)
          }
